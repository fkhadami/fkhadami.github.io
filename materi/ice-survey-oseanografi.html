<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materi ICE Survey Oseanografi · Faruq Khadami</title>

<style>
:root{
  --navy:#0e2a44; --navy-2:#13375a; --navy-3:#1b4a74; --amber:#e8a33d;
  --ink:#1c2733; --muted:#5d6b7a; --line:#dfe5ec; --bg:#f4f6f9; --card:#fff;
  --side-w:320px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.layout{display:flex;min-height:100vh}

/* Sidebar */
.side{width:var(--side-w);flex:none;background:var(--navy);color:#dbe6f1;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:22px 22px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:600}
.brand h1{font-family:"Source Serif 4",Georgia,serif;font-size:21px;line-height:1.25;margin:6px 0 4px;color:#fff;font-weight:700}
.brand .sub{font-size:12.5px;color:#9fb3c8}
.brand .back{display:inline-block;margin-top:10px;font-size:12.5px;color:#cfe0f0;text-decoration:none}
.brand .back:hover{color:var(--amber)}
.search{padding:14px 22px 10px}
.search input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:13.5px;outline:none}
.search input::placeholder{color:#8ea3b9}
.search input:focus{border-color:var(--amber)}
.nav{overflow-y:auto;flex:1;padding:4px 12px 24px}
.mod{margin-bottom:2px}
.mod-btn{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;color:inherit;padding:11px 10px;border-radius:8px}
.mod-btn:hover{background:rgba(255,255,255,.05)}
.mod.active>.mod-btn{background:var(--navy-2)}
.num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.08);color:#cfe0f0}
.mod.active .num{background:var(--amber);color:var(--navy)}
.mod-title{font-size:14px;line-height:1.35;font-weight:500;color:#eef4fa}
.mod-meta{font-size:11.5px;color:#8ea3b9;margin-top:2px}
.slist{list-style:none;margin:4px 0 8px;padding:0 0 0 48px;display:none}
.mod.active .slist{display:block}
.slist button{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;color:#b6c7d8;font-size:12.5px;line-height:1.35;padding:5px 8px;border-radius:6px}
.slist button:hover{color:#fff;background:rgba(255,255,255,.05)}
.slist button.cur{color:#fff;background:rgba(232,163,61,.16)}
.slist .sn{flex:none;width:20px;color:#7f95ab;font-variant-numeric:tabular-nums}
.results{padding:0 12px 24px;overflow-y:auto;flex:1;display:none}
.results.on{display:block}
.results .r{display:block;width:100%;text-align:left;background:none;border:0;color:#dbe6f1;padding:9px 10px;border-radius:8px}
.results .r:hover{background:rgba(255,255,255,.06)}
.results .r b{display:block;font-size:13px;font-weight:500;color:#fff}
.results .r span{font-size:11.5px;color:#8ea3b9}
.results .empty{padding:10px;font-size:13px;color:#8ea3b9}

/* Main */
.main{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:rgba(244,246,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 36px;display:flex;align-items:center;gap:16px}
.menu{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink)}
.topbar .t{flex:1;min-width:0}
.topbar .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.topbar h2{font-family:"Source Serif 4",Georgia,serif;font-size:22px;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;gap:8px}
.pager button,.present{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;color:var(--ink)}
.pager button:hover,.present:hover{border-color:#b9c4d0}
.pager button:disabled{opacity:.4;cursor:default}
.present{background:var(--navy);color:#fff;border-color:var(--navy)}
.present:hover{background:var(--navy-3)}
.deck{max-width:1080px;margin:0 auto;padding:28px 36px 80px}
.intro{color:var(--muted);font-size:14px;margin:0 0 22px}
.slide{margin:0 0 28px;scroll-margin-top:90px}
.frame{background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(16,32,52,.06),0 6px 20px rgba(16,32,52,.07);cursor:zoom-in;aspect-ratio:16/9}
.frame img{display:block;width:100%;height:100%;object-fit:contain}
.cap{display:flex;gap:10px;align-items:baseline;margin-top:9px;font-size:13px;color:var(--muted)}
.cap .k{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
details.notes{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:8px}
details.notes summary{padding:8px 12px;font-size:12.5px;color:var(--muted);cursor:pointer}
details.notes p{margin:0;padding:0 14px 12px;font-size:13.5px;line-height:1.6;white-space:pre-line}
.foot{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:20px;margin-top:10px}
.foot button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;text-align:left;max-width:48%;color:var(--ink)}
.foot button small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.foot button:hover{border-color:#b9c4d0}

/* Viewer */
.viewer{position:fixed;inset:0;background:#08131f;z-index:50;display:none;flex-direction:column}
.viewer.on{display:flex}
.vbar{display:flex;align-items:center;gap:12px;padding:10px 16px;color:#c9d6e3;font-size:13px}
.vbar .vt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar button{background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:8px;padding:7px 12px}
.vbar button:hover{background:rgba(255,255,255,.16)}
.vstage{flex:1;display:flex;align-items:center;justify-content:center;padding:0 12px 16px;min-height:0;position:relative}
.vstage img{max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:22px}
.vnav:hover{background:rgba(255,255,255,.2)}
.vprev{left:16px}.vnext{right:16px}
.vnotes{max-height:22vh;overflow:auto;color:#c9d6e3;font-size:14px;line-height:1.6;padding:0 24px 16px;white-space:pre-line;display:none}
.vnotes.on{display:block}

@media (max-width:900px){
  .side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .side.open{transform:none}
  .menu{display:block}
  .topbar{padding:12px 16px}
  .deck{padding:20px 16px 60px}
  .pager{display:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none}
  .scrim.on{display:block}
  .vnav{display:none}
}
</style>
</head>

<script>
const MODS = [{"title": "Variabilitas dalam Oseanografi", "desc": "Pengantar: bagaimana besaran laut berubah menurut ruang dan waktu — pasang surut, arus, gelombang, serta suhu dan salinitas."}, {"title": "Pengolahan Data Pasang Surut", "desc": "Dari sensor dan quality control hingga analisis harmonik, datum elevasi, dan pelaporan pasut."}, {"title": "Pengolahan Data Arus", "desc": "Konversi vektor u–v, teknik perata-rataan, matriks distribusi frekuensi, current rose, dan pelaporan arus."}, {"title": "Pengolahan Data Gelombang", "desc": "Zero up-crossing, statistik Hs/Ts, matriks distribusi frekuensi, wave rose, dan pelaporan gelombang."}, {"title": "Pengolahan Data Suhu, Salinitas, dan Densitas", "desc": "CTD dan botol Nansen, perhitungan salinitas dan densitas, QC, profil vertikal, sebaran spasial, dan stratifikasi."}, {"title": "Pelaporan Survey dan Data Oseanografi", "desc": "Menyusun laporan survey: lokasi, metode dan skenario, hasil per parameter, sintesis, kesimpulan, dan lampiran."}];
const DATA = [[{"t": "Sampul", "x": "PENGANTAR OSEANOGRAFI UNTUK NON-KELAUTAN Variabilitas dalam Oseanografi Laut tidak pernah diam: ia berubah menurut ruang dan waktu. Sifat Air Laut · Gelombang Laut · Arus Laut", "n": "Pembuka (sekitar 2 menit). Sampaikan bahwa sebelum masuk ke empat materi (pasang surut, arus, gelombang, sifat air laut), kita menyamakan satu kerangka berpikir: laut itu berubah menurut ruang dan waktu. Kerangka ini akan dipakai berulang sepanjang pertemuan."}, {"t": "Berapa suhu laut Indonesia?", "x": "MULAI DARI PERTANYAAN SEDERHANA Berapa suhu laut Indonesia? Jawaban jujurnya: tergantung kapan, di mana, dan seberapa dalam kita mengukur. Di mana? Kapan? Seberapa dalam?", "n": "Pertanyaan pemantik (sekitar 2 menit). Minta beberapa peserta menebak: 28 °C? 30 °C? Lalu tunjukkan bahwa semua tebakan bisa benar, bergantung lokasi, musim, jam, dan kedalaman. Inilah inti variabilitas: satu angka tidak pernah cukup untuk menggambarkan laut."}, {"t": "Variabilitas: besaran laut yang tidak konstan", "x": "KONSEP DASAR Variabilitas: besaran laut yang tidak konstan Variabilitas adalah perubahan nilai suatu besaran laut, seperti suhu, salinitas, arus, atau tinggi gelombang, dari satu tempat ke tempat lain dan dari satu waktu ke waktu lain. APA Besaran yang berubah Suhu, salinitas, densitas, arus, tinggi gelombang. DI MANA Variabilitas spasial Berbeda dari satu lokasi ke lokasi lain, dan dari permukaan ke dasar. KAPAN Variabilitas temporal Berbeda dari detik ke detik, musim ke musim, hingga abad ke abad. Analogi: lalu lintas kota. Padat di satu ruas, lengang di ruas lain (ruang). Padat saat jam pulang kerja, lengang tengah malam (waktu). Variabilitas dalam Oseanografi 3 / 42", "n": "Definisi (sekitar 3 menit). Tekankan tiga pertanyaan: apa yang berubah, di mana, dan kapan. Analogi lalu lintas membantu peserta non-kelautan: kita tidak bertanya \"berapa kepadatan lalu lintas kota?\", melainkan \"di ruas mana dan jam berapa?\". Laut sama."}, {"t": "Variabilitas spasial: berubah menurut tempat", "x": "BAGIAN 1 Variabilitas spasial: berubah menurut tempat HORIZONTAL Antar lintang Salinitas tertinggi di lintang 20–30° (penguapan melebihi hujan), lebih rendah di ekuator. Sifat air laut HORIZONTAL Pantai ke laut lepas Gelombang melambat dan pecah di perairan dangkal; di muara, air sungai bertemu air laut. Gelombang · Arus VERTIKAL Permukaan ke dasar Suhu, salinitas, dan densitas berubah menurut kedalaman, membentuk lapisan-lapisan. Sifat air laut Sumber data: materi Sifat Air Laut (Tomczak, 2006; Kostka, 2002) 4 / 42", "n": "Spasial (sekitar 3 menit). Tiga contoh yang nanti muncul di materi: (1) antar lintang, salinitas permukaan mengikuti keseimbangan penguapan dan hujan; (2) dari pantai ke laut lepas, gelombang dan percampuran air tawar-asin berubah; (3) ke arah vertikal, laut berlapis. Tanyakan: menurut Anda, di mana laut paling asin, di khatulistiwa atau di lintang 25°?"}, {"t": "Dalam satu titik, laut berlapis", "x": "CONTOH SPASIAL VERTIKAL Dalam satu titik, laut berlapis Lapisan tercampur Termoklin Lapisan dalam Garis oranye = suhu. Ke kanan makin hangat, ke bawah makin dalam. Lapisan tercampur Sekitar 100 m teratas. Suhu hampir seragam karena diaduk angin. Termoklin Suhu turun tajam. Di tropis, selisihnya dengan permukaan bisa 15–20 °C. Lapisan dalam Dingin dan relatif seragam; menyimpan sekitar 80% volume lautan. Sumber data: materi Sifat Air Laut (Kostka, 2002). Diagram skematis. 5 / 42", "n": "Vertikal (sekitar 3 menit). Satu titik di laut bukan satu nilai, melainkan satu profil. Ketebalan lapisan tercampur bervariasi menurut lokasi dan musim; angka 100 m adalah gambaran umum. Kaitkan nanti ke materi sifat air laut (profil suhu, densitas, stabilitas kolom air)."}, {"t": "Variabilitas temporal: berubah menurut waktu", "x": "BAGIAN 2 Variabilitas temporal: berubah menurut waktu Detik–menit Gelombang angin Muka laut naik-turun terus-menerus. Jam Pasang surut Satu siklus sekitar 12 atau 24 jam. Hari–minggu Cuaca dan badai Angin kencang membangkitkan gelombang tinggi. Musiman Monsun Arah angin berbalik, pola arus ikut berubah. Antartahun El Niño dan La Niña Suhu laut tropis menyimpang dan mengubah pola hujan. Dekade–abad Sirkulasi global Sirkulasi laut dalam butuh ratusan hingga ribuan tahun. Cepat Lambat Variabilitas dalam Oseanografi 6 / 42", "n": "Temporal (sekitar 4 menit). Baca dari kiri atas ke kanan bawah: dari fenomena tercepat ke paling lambat. Beberapa akan dibahas langsung hari ini: gelombang (materi gelombang), pasang surut dan monsun (materi arus). Tanyakan: fenomena mana yang pernah Anda rasakan langsung? (Ombak, pasang surut di pantai, musim ombak besar.)"}, {"t": "Makin luas, makin lambat", "x": "RUANG DAN WAKTU BERSAMA Makin luas, makin lambat Fenomena kecil berlangsung cepat; fenomena besar berlangsung lambat. Skala pengamatan harus cocok dengan fenomena yang dicari. Mengukur arus selama satu jam tidak akan memperlihatkan gyre. Gelombang angin Pasang surut Pusaran (eddy) Monsun El Niño Gyre global detik jam hari bulan tahun abad 1 m 100 m 10 km 1.000 km 10.000 km Ukuran Waktu yang dibutuhkan Diagram skematis; nilai perkiraan. 7 / 42", "n": "Ruang + waktu (sekitar 4 menit). Ini slide inti. Telusuri satu per satu: gelombang angin kecil dan cepat; pasang surut skala cekungan tetapi siklusnya hanya jam; pusaran puluhan hingga ratusan km berumur minggu-bulan; monsun musiman; El Niño antartahun; gyre dan sirkulasi global butuh dekade hingga abad. Pasang surut sedikit keluar dari tren umum, dan itu poin menarik untuk didiskusikan. Diagram ini skematis, bukan hasil pengukuran."}, {"t": "Dua cara melihat variabilitas", "x": "CARA MENGAMATI Dua cara melihat variabilitas Satu tempat, banyak waktu Alat dipasang tetap dan merekam terus-menerus. Hasilnya grafik terhadap waktu (deret waktu). CONTOH Arus pasut di Selat Gaspar dan Selat Karimata pada beberapa kedalaman. Satu waktu, banyak tempat Survei kapal atau satelit memotret banyak lokasi sekaligus. Hasilnya peta atau penampang. CONTOH Peta salinitas permukaan laut pada bulan Agustus. Satu titik dan satu waktu saja tidak cukup untuk mewakili laut. Sumber contoh: materi Arus Laut dan Sifat Air Laut 8 / 42", "n": "Cara mengamati (sekitar 3 menit). Deret waktu menjawab \"bagaimana berubah dari waktu ke waktu di sini?\"; peta atau transek menjawab \"bagaimana berbeda dari tempat ke tempat saat ini?\". Keduanya saling melengkapi. Contoh dari materi: pengukuran arus pasut di Selat Gaspar/Karimata (deret waktu) dan peta salinitas muka laut (spasial)."}, {"t": "Yang kita ukur adalah tumpukan sinyal", "x": "MEMISAHKAN SINYAL Yang kita ukur adalah tumpukan sinyal Arus teramati Yang tercatat oleh alat di lokasi pengukuran = Arus pasut Berulang teratur, dapat diprediksi + Arus non-pasut Angin, musim, perbedaan densitas Contoh Selat Gaspar (kedalaman 1 m): arus teramati dipisahkan menjadi arus pasut dan non-pasut. Bila keduanya searah, kecepatan totalnya bertambah. Sumber data dan gambar: materi Arus Laut (Arus Pasut dan Non-Pasut, OS2101 ITB) 9 / 42", "n": "Memisahkan sinyal (sekitar 3 menit). Gambar di kanan adalah data nyata dari materi arus: tiga panel dari atas ke bawah adalah arus hasil pengamatan, arus pasut, dan arus non-pasut di Selat Gaspar (Desember, musim barat laut). Pasut tampak berulang teratur; non-pasut tidak. Data lapangan selalu merupakan gabungan beberapa proses yang berjalan pada skala waktu berbeda. Ini jembatan ke materi arus. Ide yang sama berlaku untuk gelombang (sea dan swell) dan suhu (harian, musiman)."}, {"t": "Empat materi, empat lensa variabilitas", "x": "MENUJU MATERI Empat materi, empat lensa variabilitas 1 Pasang surut Jam, bulan, hingga 18,6 tahun; tipe berbeda tiap lokasi. Mengapa muka laut naik-turun teratur? 2 Arus laut Semua skala: jam (pasut), musim (monsun), dekade (gyre). Mengapa air laut bergerak dan pola arusnya berubah? 3 Gelombang laut Detik–menit, dan berubah dari laut lepas ke pantai. Mengapa ombak berubah bentuk di dekat pantai? 4 Salinitas dan suhu Antar lintang, kedalaman, dan musim. Mengapa suhu dan salinitas berbeda di tiap tempat? Pada tiap fenomena, tanyakan: di mana ia berubah, dan seberapa cepat? Variabilitas dalam Oseanografi 10 / 42", "n": "Jembatan (sekitar 2 menit). Urutan materi di deck ini: pasut, arus, gelombang, lalu salinitas dan suhu. Pasut didahulukan karena menjelaskan arus pasut dan menjadi contoh paling teratur dari variabilitas temporal. Bila Anda lebih suka memulai dari sifat air laut (karena densitas menjelaskan sebagian arus), bagian-bagiannya bisa ditukar urutannya. Pulangkan peserta ke dua pertanyaan di bagian bawah slide setiap kali berpindah topik."}, {"t": "Pasang Surut Laut", "x": "MATERI 1 DARI 4 Pasang Surut Laut Mengapa muka laut naik-turun teratur, dan mengapa bisa diprediksi? Jam: pasang-surut Hari-bulan: spring-neap Tahun: siklus 18,6 tahun", "n": "Pembuka materi pasut. Pasut adalah variabilitas temporal yang paling teratur di laut, sehingga bisa diprediksi jauh hari. Ia juga menjadi pintu masuk ke materi arus (arus pasut) dan gelombang (pasut sebagai gelombang yang sangat panjang)."}, {"t": "Bulan menarik, bumi berputar: dua tonjolan air", "x": "PASANG SURUT · PENYEBAB Bulan menarik, bumi berputar: dua tonjolan air 1 Gaya tarik bulan lebih kuat di sisi bumi yang dekat bulan. 2 Gaya sentrifugal: bumi dan bulan berputar mengitari pusat massa bersama (periode 27,3 hari), sama besar di semua titik bumi. 3 Resultannya adalah gaya pembangkit pasut: air menumpuk di dua sisi, dekat bulan dan di sisi seberangnya. Bumi berotasi 24 jam, sehingga satu tempat melewati dua tonjolan: dua kali pasang dan dua kali surut per hari (kondisi ideal). Sumber data dan gambar: materi Pasang Surut Laut (Dr. Mutiara Rachmat Putri, OS2101 ITB) 12 / 42", "n": "Penjelasan tanpa rumus: tarik bulan dikurangi gaya sentrifugal sistem bumi-bulan memberi dua tonjolan, bukan satu. Analogi: air \"tertinggal\" di sisi jauh karena bumi sendiri ditarik lebih kuat ke arah bulan. Pada kenyataannya tidak selalu 2x pasang dan 2x surut sehari (lihat slide tipe pasut), karena bulan juga bergerak dan sumbu orbitnya miring."}, {"t": "Pasut berulang: harian hingga bulanan", "x": "PASANG SURUT · VARIABILITAS TEMPORAL Pasut berulang: harian hingga bulanan Hari bulan 24 jam 50 menit: pasang terlambat sekitar 50 menit tiap hari. Siklus bulan 29,5 hari. Spring tide: bumi-bulan-matahari segaris (bulan baru dan purnama), tunggang pasut maksimum. Neap tide: saling tegak lurus (perempat), tunggang pasut minimum. Orbit bulan miring 28,5° terhadap ekuator, sehingga tinggi dua pasang dalam sehari bisa berbeda (diurnal inequality). Siklus kemiringan ini berulang tiap 18,6 tahun. Sumber data dan gambar: materi Pasang Surut Laut (Dr. Mutiara Rachmat Putri, OS2101 ITB) 13 / 42", "n": "Kaitkan dengan pengalaman: kapan air laut terasa paling tinggi, saat purnama atau bulan baru? Itu spring tide. Perhatikan skala waktu bertingkat: 12 jam 25 menit (satu pasang), 24 jam 50 menit (hari bulan), 14,8 hari (spring ke neap), 29,5 hari (siklus bulan), 18,6 tahun (rotasi bidang orbit). Ini contoh sempurna variabilitas multi-skala pada satu fenomena."}, {"t": "Pasut teramati adalah jumlah banyak komponen", "x": "PASANG SURUT · MEMISAHKAN SINYAL Pasut teramati adalah jumlah banyak komponen Kurva gabungan = kurva bulan + kurva matahari. Dua komponen utama saling memperkuat atau melemahkan. Komponen Asal Periode (jam) M2 Bulan (semidiurnal) 12,42 S2 Matahari (semidiurnal) 12,00 K1 Bulan-matahari (diurnal) 23,93 O1 Bulan (diurnal) 25,82 Di perairan dangkal, gesekan dasar menambah komponen perairan dangkal. Sumber data dan gambar: materi Pasang Surut Laut (Dr. Mutiara Rachmat Putri, OS2101 ITB). Tabel: komponen utama. 14 / 42", "n": "Hubungkan ke slide \"Memisahkan sinyal\": pasut juga merupakan tumpukan sinyal. Tiap komponen punya periode sendiri; analisis harmonik memisahkannya dari rekaman muka air. Dari rekaman ini kita bisa memprediksi pasut jauh ke depan, sesuatu yang tidak mungkin untuk gelombang angin atau arus non-pasut. Garis kuning = matahari, garis putus-putus = bulan, garis biru = gabungan (pada gambar sumber)."}, {"t": "Tipe pasut berbeda di tiap tempat", "x": "PASANG SURUT · VARIABILITAS SPASIAL Tipe pasut berbeda di tiap tempat Bilangan Formzahl F = (K1 + O1) / (M2 + S2) Semidiurnal F ≤ 0,25 2 pasang sehari, tinggi hampir sama. Contoh: Selat Malaka. Campuran, condong ganda 0,25 < F ≤ 1,5 2 pasang sehari, tinggi dan waktu berbeda. Campuran, condong tunggal 1,5 < F ≤ 3 Umumnya 1 pasang sehari, kadang 2. Diurnal (tunggal) F > 3 1 pasang dan 1 surut sehari. Contoh: Selat Bangka. Sumber data dan gambar: materi Pasang Surut Laut (Dr. Mutiara Rachmat Putri, OS2101 ITB) 15 / 42", "n": "Gambar: tiga tempat, tiga bentuk pasut. Cape Cod semidiurnal, Mobile diurnal, Los Angeles campuran. Tipe ditentukan oleh perbandingan amplitudo komponen diurnal (K1, O1) terhadap semidiurnal (M2, S2). Ini variabilitas spasial: lokasi yang berdekatan di Indonesia bisa punya tipe berbeda, dan itu penting untuk perencanaan pelabuhan, tambak, dan navigasi. Contoh lokasi dari materi."}, {"t": "Dari naik-turun muka air menjadi arus pasut", "x": "PASANG SURUT · MENUJU ARUS DAN GELOMBANG Dari naik-turun muka air menjadi arus pasut Titik amphidromik: tunggang pasut nol; gelombang pasut berputar mengitarinya (akibat Coriolis dan geometri pantai). Flood Muka air naik: arus pasut masuk ke teluk atau estuari. Ebb Muka air turun: arus pasut keluar. Slack Saat air tertinggi atau terendah: kecepatan arus mendekati nol. Pasut adalah gelombang yang sangat panjang. Saat melewati selat dan muara, ia menjadi arus pasut: inilah penghubung ke materi arus dan gelombang. Sumber data dan gambar: materi Pasang Surut Laut (Dr. Mutiara Rachmat Putri, OS2101 ITB) 16 / 42", "n": "Jembatan ke materi berikutnya. Arus: naik-turun muka air di laut terbuka memaksa air mengalir masuk dan keluar selat dan muara (flood, ebb); inilah arus pasut yang akan dibahas di materi arus (termasuk pemisahan arus pasut dan non-pasut di Selat Gaspar). Gelombang: pasut adalah gelombang air dangkal karena panjang gelombangnya jauh melebihi kedalaman laut, sehingga kecepatannya bergantung pada kedalaman (pengetahuan umum; konsep kecepatan gelombang di perairan dangkal ada di materi gelombang). Titik amphidromik: pada peta, garis-garis yang bertemu di satu titik; pasut hampir tidak berubah di titik itu."}, {"t": "Arus Laut", "x": "MATERI 2 DARI 4 Arus Laut Mengapa air laut bergerak, dan mengapa pola geraknya berubah? Pasut: jam Monsun: musim Gyre: dekade", "n": "Pembuka materi arus. Arus adalah contoh paling jelas variabilitas multi-skala: satu lokasi bisa mencatat arus pasut (jam), arus musiman (monsun), dan menjadi bagian dari gyre yang berputar selama dekade."}, {"t": "Arus: pergerakan massa air laut", "x": "ARUS LAUT Arus: pergerakan massa air laut 10% Arus permukaan (0–400 m), didorong angin dan perbedaan suhu. 90% Di dalam dan di bawah piknoklin, digerakkan perbedaan densitas. Mengapa penting? Arus memindahkan panas dari tropis ke lintang tinggi, menyebarkan nutrien dan organisme, memengaruhi iklim dan cuaca, serta menentukan jalur pelayaran. Sumber data dan gambar: materi Arus Laut (OS2101, ITB). Gambar: sabuk konveyor global. 18 / 42", "n": "Sekitar 10% air laut dunia bergerak horizontal di lapisan permukaan (0–400 m), digerakkan oleh tegangan angin serta ekspansi dan kontraksi termal. Sisanya, sekitar 90%, bergerak di bawah dan di dalam lapisan piknoklin, digerakkan gravitasi akibat perbedaan densitas antar lapisan. Gambar di kanan menunjukkan sabuk konveyor global: jalur merah adalah arus permukaan hangat, jalur ungu adalah arus dasar yang dingin dan asin. Piknoklin akan dijelaskan di bagian sifat air laut."}, {"t": "Apa yang menggerakkan dan membelokkan arus?", "x": "ARUS LAUT Apa yang menggerakkan dan membelokkan arus? Penggerak Gaya primer: memulai arus dan menentukan kecepatannya Tegangan angin: mendorong air di permukaan. Pemuaian dan penyusutan termal: air tropis memuai sehingga muka laut sedikit lebih tinggi (selisih sekitar 8 cm). Perbedaan densitas: akibat suhu dan salinitas. Pengarah Gaya sekunder: memengaruhi arah dan kondisi aliran Coriolis: rotasi bumi membelokkan arus ke kanan di belahan bumi utara, ke kiri di selatan. Gravitasi dan gesekan: memperlambat gerak arus. Bentuk basin: benua menahan dan membelokkan aliran. Sumber data: materi Arus Laut (OS2101, ITB) 19 / 42", "n": "Analogi: penggerak adalah \"dorongan\", pengarah adalah \"setir dan rem\". Coriolis tidak menggerakkan arus, hanya membelokkannya. Pasut dan gelombang pecah juga dapat membangkitkan arus; keduanya dibahas di slide berikutnya dan di bagian gelombang."}, {"t": "Arus pasut: bolak-balik dan dapat diprediksi", "x": "ARUS LAUT · SKALA JAM Arus pasut: bolak-balik dan dapat diprediksi Tinggi muka air (pasang di puncak, surut di lembah) Kecepatan arus (di atas garis tengah = ke arah daratan) pasang pasang surut surut Periodik, sehingga dapat diprediksi. Laju maksimum saat muka air di tengah; laju nol saat pasang atau surut puncak. Jeda singkat saat arah berbalik disebut slack water. Di muara dan selat: bolak-balik (flood masuk, ebb keluar). Di laut lepas: berputar membentuk elips. Sumber data: materi Arus Laut (OS2101, ITB). Grafik skematis. 20 / 42", "n": "Arus pasut berubah dalam skala jam. Tipe pasut menentukan berapa kali arah berbalik dalam sehari: harian tunggal satu kali, harian ganda dua kali, campuran antara satu dan dua kali. Di selat yang menghubungkan dua perairan yang dipengaruhi pasut secara independen (misalnya Selat Malaka), dikenal tipe hidrolik. Di laut lepas arus pasut berputar: searah jarum jam di belahan bumi utara, berlawanan di selatan. Kurva di slide ini skematis untuk gelombang pasut ideal."}, {"t": "Muara: air tawar bertemu air laut", "x": "ARUS LAUT · ANTARA SUNGAI DAN LAUT Muara: air tawar bertemu air laut Perbedaan densitas menimbulkan gradien tekanan horizontal: air tawar (ringan) mengalir ke laut di permukaan, air laut (berat) masuk ke hulu di dasar. Salt wedge Percampuran lemah: debit sungai besar, pasut lemah. Partially mixed Percampuran sebagian: di antara dua tipe lainnya. Well mixed Percampuran sempurna: debit sungai kecil, pasut kuat. Sumber data dan gambar: materi Arus Laut (Arus Densitas, OS2101 ITB) 21 / 42", "n": "Arus densitas muncul karena gradien densitas horizontal yang dibentuk oleh variasi salinitas, suhu, atau kandungan sedimen. Pada gambar: garis kontur adalah salinitas (0 di hulu hingga 35 di laut), profil di bawahnya menunjukkan haloklin dan arus berlawanan arah antara lapisan atas dan bawah. Di muara, variabilitas spasial (permukaan vs dasar, hulu vs hilir) dan temporal (debit sungai musiman, pasut) bekerja bersamaan; tipe stratifikasi dapat berubah menurut musim dan siklus pasut. Pada tipe well mixed, salinitas seragam dari permukaan ke dasar tetapi tetap menurun ke arah hulu."}, {"t": "Upwelling: air dingin naik ke permukaan", "x": "ARUS LAUT · ANGIN DAN CORIOLIS Upwelling: air dingin naik ke permukaan 1 Angin bertiup sejajar pantai. 2 Transpor Ekman bergerak tegak lurus arah angin: ke kanan di belahan bumi utara, ke kiri di selatan. 3 Jika menjauhi pantai, air dari lapisan dalam naik mengisi kekosongan (upwelling). Jika menuju pantai, air permukaan tenggelam (downwelling). Ciri upwelling: lebih dingin, salinitas dan densitas lebih tinggi, muka air lebih rendah, nutrien lebih tinggi. Sumber data dan gambar: materi Arus Laut (Arus Ekman dan Upwelling, OS2101 ITB) 22 / 42", "n": "Bila pantai berada di sebelah kanan arah angin (belahan bumi utara), transpor Ekman menuju pantai dan terjadi downwelling; bila pantai di sebelah kiri, transpor menjauhi pantai dan terjadi upwelling. Di belahan bumi selatan polanya terbalik. Contoh untuk diskusi (pengetahuan umum, bukan dari materi): perairan selatan Jawa-Bali saat musim timur (monsun tenggara) sering dikaitkan dengan upwelling; tanyakan kepada peserta mengapa nelayan di sana mengenal musim tertentu sebagai musim ikan."}, {"t": "Gyre: sirkulasi arus skala samudra", "x": "ARUS LAUT · SKALA SAMUDRA Gyre: sirkulasi arus skala samudra Terbentuk oleh angin pasat dan baratan, gaya Coriolis, dan benua sebagai penghalang. Belahan utara berputar searah jarum jam; belahan selatan sebaliknya. Arus batas barat (Gulf Stream, Kuroshio): sempit (sekitar 100 km) dan cepat (2–3 m/s). Arus batas timur lebih lemah. Mengangkut panas dari tropis ke lintang menengah. Sumber data dan gambar: materi Arus Laut (Sirkulasi Arus Global, OS2101 ITB) 23 / 42", "n": "Pada gambar, perhatikan arah putaran: Atlantik utara searah jarum jam, Atlantik selatan berlawanan. Gyre adalah variabilitas spasial sekaligus bukti bahwa \"satu laut\" tidak seragam: sisi barat dan timur samudra berbeda tajam. Intensifikasi di batas barat dijelaskan lewat kekekalan vortisitas (tidak perlu diturunkan di kelas ini). Kecepatan Gulf Stream dan Kuroshio sekitar 2,5–3 m/s menurut materi."}, {"t": "Arus laut di berbagai skala waktu", "x": "RINGKASAN ARUS Arus laut di berbagai skala waktu Skala waktu Arus Penyebab Jam Arus pasut Pasang surut; bolak-balik atau berputar, dapat diprediksi. Hari Arus inersia Sisa gerak setelah angin berhenti, dibelokkan Coriolis; periodenya 12 jam di kutub dan 24 jam di lintang 30°. Musim Arus monsun Angin berbalik; pola arus di Samudra Hindia berganti antara monsun barat daya dan timur laut. Dekade ke atas Gyre dan sirkulasi termohalin Angin skala samudra dan perbedaan densitas. Sumber data: materi Arus Laut (OS2101, ITB) 24 / 42", "n": "Rangkuman bagian arus lewat kacamata variabilitas: satu alat ukur arus di satu titik merekam semua baris tabel ini sekaligus. Itu sebabnya sinyal harus dipisahkan (lihat slide 9). Periode inersia bergantung lintang: sekitar 12 jam/sin(lintang), sehingga makin panjang ke arah ekuator (materi memberi contoh 120 jam di lintang 6°). Pada musim barat daya, arus ekuator utara hilang dan digantikan arus musim barat daya yang bergerak ke timur."}, {"t": "Gelombang Laut", "x": "MATERI 3 DARI 4 Gelombang Laut Mengapa ombak berubah dari laut lepas hingga ke pantai? Detik–menit Laut lepas ke pantai", "n": "Pembuka materi gelombang. Variabilitas temporal gelombang sangat cepat (periode detik hingga puluhan detik), sedangkan variabilitas spasialnya besar: gelombang berubah drastis sejak dibangkitkan di laut lepas hingga pecah di pantai. Foto: gelombang plunging, dari materi Gelombang Laut."}, {"t": "Dari mana gelombang berasal?", "x": "GELOMBANG LAUT Dari mana gelombang berasal? Kecepatan angin: makin kencang, makin besar gelombang. Durasi: makin lama angin bertiup, makin banyak energi pindah ke laut. Fetch: jarak yang disapu angin di atas air; makin panjang, makin tinggi gelombang. Bila angin terus bertiup, gelombang tumbuh sampai energi dari angin seimbang dengan energi yang hilang saat gelombang pecah (fully developed sea). Sumber data dan gambar: materi Gelombang Laut (ITB) 26 / 42", "n": "Mekanisme: angin yang bertiup di atas permukaan laut lebih dulu membentuk riak (ripples) yang menambah kekasaran permukaan dan membantu transfer energi dari angin. Bila angin terus bertiup, energi terus ditransfer dan gelombang menjadi lebih panjang dan lebih tinggi, tetapi tidak beraturan (sea). Tiga faktor penentu: kecepatan, durasi, dan fetch. Gambar dari materi: perhatikan bagaimana riak berkembang menjadi gelombang pendek, lalu fully developed sea, lalu berubah menjadi swell setelah meninggalkan daerah pembangkitan."}, {"t": "Sea dan swell: ombak dan alun", "x": "GELOMBANG LAUT Sea dan swell: ombak dan alun Sea (ombak) Masih berada di daerah pengaruh angin Bentuk tidak teratur Panjang gelombang pendek Puncak runcing dan berbuih Swell (alun) Sudah keluar dari daerah pengaruh angin Bentuk teratur Panjang gelombang panjang Menjalar jauh ke pantai, juga saat cuaca tenang Sumber data: materi Gelombang Laut (ITB). Bentuk gelombang skematis. 27 / 42", "n": "Ini contoh variabilitas ruang dan waktu sekaligus: badai di tengah samudra membangkitkan sea; gelombang itu lalu menyebar keluar dari daerah badai menjadi swell dan tiba di pantai jauh, berhari-hari kemudian. Itulah sebabnya ombak besar bisa muncul di pantai yang cuacanya cerah."}, {"t": "Anatomi gelombang", "x": "GELOMBANG LAUT Anatomi gelombang L (panjang) H (tinggi) a puncak lembah muka air tenang Tinggi (H): jarak puncak ke lembah, sama dengan 2a. Amplitudo (a): setengah dari tinggi. Panjang (L): jarak antar dua puncak berurutan. Periode (T): waktu dua puncak berurutan melewati satu titik. Cepat rambat (C) = L / T Sumber data: materi Gelombang Laut (Parameter Gelombang). Diagram skematis. 28 / 42", "n": "Gelombang nyata sangat kompleks; untuk mempelajarinya, gelombang tak beraturan dianggap sebagai superposisi banyak gelombang sinusoidal sederhana. Empat parameter ini cukup untuk memahami sisa materi. Contoh cepat: jika periode 10 detik dan panjang 156 m di laut dalam, cepat rambatnya sekitar 15,6 m/s."}, {"t": "Kecepatan gelombang bergantung pada kedalaman", "x": "GELOMBANG LAUT Kecepatan gelombang bergantung pada kedalaman Kedalaman h lebih dari ½ L Perairan dalam Gelombang pendek. Gelombang yang lebih panjang melaju lebih cepat (dispersif). C ≈ 1,56 × T Alun berperiode 12 detik: sekitar 19 m/s (±67 km/jam). h antara L/20 dan ½ L Perairan menengah Peralihan: kecepatan dipengaruhi panjang gelombang sekaligus kedalaman. C = f (L, h) Dihitung dengan rumus penuh teori gelombang linier. Kedalaman h kurang dari L/20 Perairan dangkal Gelombang panjang. Kecepatan hanya ditentukan kedalaman (non-dispersif). C = √(g × h) Kedalaman 4 m: sekitar 6,3 m/s (±23 km/jam). Makin dangkal, makin lambat: inilah awal dari semua perubahan gelombang di dekat pantai. Sumber data: materi Gelombang Laut (Hubungan Dispersi). Angka contoh dihitung penulis. 29 / 42", "n": "L = panjang gelombang, T = periode (detik), g = percepatan gravitasi (9,8 m/s²), h = kedalaman. Di laut dalam, T tetap saat gelombang menjalar, sehingga gelombang dengan periode panjang (alun) melaju jauh lebih cepat daripada ombak pendek; itu sebabnya alun tiba lebih dulu di pantai dibanding ombak dari badai yang sama. Hitungan contoh: 1,56 × 12 = 18,7 m/s; akar(9,8 × 4) = 6,3 m/s."}, {"t": "Gelombang membawa energi, bukan air", "x": "GELOMBANG LAUT Gelombang membawa energi, bukan air Perairan dalam: lintasan melingkar Lingkaran mengecil cepat ke bawah. Pada kedalaman sekitar setengah panjang gelombang, pengaruhnya hampir hilang. Perairan dangkal: lintasan elips Makin ke dasar makin pipih; di dasar, partikel air hanya bergerak maju-mundur. Sumber data dan gambar: materi Gelombang Laut (Lintasan Partikel Air) 30 / 42", "n": "Analogi: \"gelombang\" di stadion. Penonton hanya berdiri dan duduk, tetapi gelombangnya berjalan keliling stadion. Air juga hanya bergerak dalam lingkaran atau elips kecil; yang berpindah adalah energinya. Itu sebabnya benda yang mengapung di laut dalam hanya naik-turun di tempatnya saat gelombang lewat. Radius orbit berkurang secara eksponensial terhadap kedalaman."}, {"t": "Menuju pantai: gelombang berubah bentuk", "x": "GELOMBANG LAUT · VARIABILITAS SPASIAL Menuju pantai: gelombang berubah bentuk Shoaling Gelombang melambat dan memendek, tetapi tingginya bertambah sebelum pecah. Refraksi Muka gelombang di air dalam melaju lebih cepat, sehingga arahnya membelok mendekati sejajar pantai. Tanjung dan teluk Energi memusat di tanjung (gelombang tinggi) dan menyebar di teluk (gelombang lebih kecil). Difraksi dan refleksi Gelombang membelok ke area terlindung di ujung pemecah gelombang, dan dipantulkan oleh dinding vertikal. Sumber data dan gambar: materi Gelombang Laut (Transformasi Gelombang) 31 / 42", "n": "Ini inti variabilitas spasial gelombang: satu rangkaian gelombang yang sama menghasilkan tinggi gelombang yang berbeda di tempat berbeda sepanjang garis pantai. Pada pantai dengan garis lurus dan kontur kedalaman sejajar pantai, refraksi membuat muka gelombang cenderung sejajar garis pantai. Relevansi rekayasa pantai: penempatan pelabuhan, pemecah gelombang, dan area wisata pantai bergantung pada pola ini. Kalau waktu tersedia, minta peserta menyebut pantai yang mereka kenal dengan tanjung dan teluk."}, {"t": "Gelombang pecah di pantai", "x": "GELOMBANG LAUT Gelombang pecah di pantai Gelombang makin tinggi dan curam di perairan dangkal sampai tidak stabil, lalu pecah. Tipe Kemiringan pantai Ciri Spilling Landai Buih turun pelan dari puncak Plunging Lebih curam Puncak menukik dan menggulung Surging Sangat curam Naik ke pantai nyaris tanpa pecah Collapsing Peralihan Gabungan plunging dan surging Efek lanjutan: gelombang pecah membangkitkan arus sejajar pantai dan rip current, yang berbahaya bagi perenang. Sumber data dan gambar: materi Gelombang Laut dan Arus Laut. Kolom Ciri: deskripsi umum. 32 / 42", "n": "Jembatan ke materi arus: gelombang pecah adalah salah satu penyebab arus (lihat daftar penyebab arus). Rip current adalah arus sempit yang mengalir menjauhi pantai dan dapat menarik perenang ke laut. Tanda-tandanya biasanya berupa alur air yang tampak lebih tenang atau keruh di antara deretan ombak pecah. Ingatkan peserta: jangan melawan arus, berenanglah sejajar pantai."}, {"t": "Gelombang pada berbagai skala", "x": "GELOMBANG LAUT Gelombang pada berbagai skala Seiche Osilasi air di teluk, danau, atau basin tertutup berupa gelombang berdiri; resonansi bila periode alami basin sama dengan periode pemaksa. Gelombang internal Gelombang di dalam kolom air, pada lapisan dengan gradien densitas, bukan di permukaan. Grup gelombang Gelombang dengan panjang mirip membentuk kelompok; di laut dalam, kelompok bergerak setengah kecepatan gelombang individunya. Sumber data dan gambar: materi Gelombang Laut (ITB) 33 / 42", "n": "Slide opsional bila waktu terbatas. Gambar di kiri dari materi menunjukkan bahwa gelombang laut mencakup rentang periode yang sangat lebar, dari riak sampai pasut. Seiche, gelombang internal, dan grup gelombang menunjukkan bahwa \"gelombang\" tidak hanya ombak di permukaan: ada gelombang yang diam di tempat (seiche), gelombang tersembunyi di dalam laut (internal), dan pola pengelompokan gelombang (grup). Seiche penting untuk pelabuhan dan teluk karena resonansi dapat memperbesar osilasi."}, {"t": "Salinitas dan Suhu Laut", "x": "MATERI 4 DARI 4 Salinitas dan Suhu Laut Mengapa sifat air laut berbeda menurut lintang, kedalaman, dan musim? Lintang Kedalaman Musim", "n": "Pembuka materi sifat air laut. Bagian ini paling kental variabilitas spasialnya: lintang dan kedalaman mengatur salinitas, suhu, dan densitas. Densitas pada gilirannya menjelaskan arus lapisan dalam yang tadi disebut 90% dari air laut."}, {"t": "Air laut: air dengan garam terlarut", "x": "SALINITAS Air laut: air dengan garam terlarut Salinitas adalah jumlah garam terlarut dalam air laut: rata-rata sekitar 35 gram per kilogram (35 ‰). Prinsip proporsi konstan: total garam berbeda dari tempat ke tempat, tetapi perbandingan ion-ion utamanya hampir selalu sama, karena arus dan turbulensi terus mengaduk laut. KOMPOSISI GARAM TERLARUT (PERSEN BERAT) Klorida 55% Natrium 31% Sulfat 8% Magnesium 4% Kalsium 1% Kalium 1% Sumber data: materi Sifat Air Laut (prinsip proporsi konstan); persentase komposisi: angka umum, dibulatkan. 35 / 42", "n": "Garam yang kita maksud bukan hanya garam dapur: ion klorida dan natrium dominan, disusul sulfat, magnesium, kalsium, dan kalium (sekitar 99% dari seluruh garam terlarut). Variabilitas salinitas adalah variabilitas jumlah total garam (atau air tawar yang ditambah/dikurangi), bukan perubahan resep garamnya. Hal ini memudahkan pengukuran: cukup mengukur satu komponen atau sifat (misalnya konduktivitas) untuk menghitung salinitas."}, {"t": "Salinitas berubah menurut lintang", "x": "SALINITAS · VARIABILITAS SPASIAL Salinitas berubah menurut lintang Salinitas ditentukan oleh selisih penguapan dan hujan (E − P). 440 ribu km³/tahun air menguap dari laut 411 ribu km³/tahun jatuh kembali sebagai hujan di laut 29 ribu km³/tahun dikembalikan oleh aliran sungai Di subtropis penguapan melebihi hujan, sehingga salinitas tinggi; di ekuator hujan melimpah, dan di atas 30° salinitas turun ke arah kutub. Sumber data dan gambar: materi Sifat Air Laut (Tomczak, 2006; Kostka, 2002) 36 / 42", "n": "Pada peta, cari dua daerah salinitas tinggi di lintang subtropis dan daerah salinitas lebih rendah di sekitar ekuator serta lintang tinggi. Pola ini muncul karena zona subtropis (sabuk tekanan tinggi) kering dan banyak penguapan, sedangkan ekuator sangat basah. Nilai nyata berkisar di sekitar 34–37 ‰. Di estuari dan dekat sungai besar, salinitas dapat jauh lebih rendah."}, {"t": "Suhu permukaan: lintang dan musim", "x": "SUHU · VARIABILITAS SPASIAL DAN TEMPORAL Suhu permukaan: lintang dan musim Agustus: musim panas belahan utara Februari: musim dingin belahan utara. Pola hangat di tropis dan dingin di kutub bergeser mengikuti musim. Sumber data dan gambar: materi Sifat Air Laut (Suhu Permukaan) 37 / 42", "n": "Bandingkan dua peta: tropis paling hangat (pemanasan matahari paling besar), makin ke kutub makin dingin hingga mendekati titik beku air laut (sekitar −1,9 °C). Isoterm bergeser ke utara pada Agustus dan ke selatan pada Februari: ini variabilitas spasial sekaligus temporal. Pola nyata tidak simetris karena arus laut ikut memindahkan panas (gyre, Gulf Stream), dan itu menghubungkan materi suhu dengan materi arus. Ajukan pertanyaan: apa yang menyebabkan pola spasial suhu itu?"}, {"t": "Profil suhu: berbeda menurut lintang dan musim", "x": "SUHU · LINTANG, KEDALAMAN, DAN MUSIM Profil suhu: berbeda menurut lintang dan musim Menurut lintang Tropis: termoklin permanen, selisih dengan permukaan 15–20 °C. Kutub: dingin dan seragam, tanpa termoklin. Menurut musim Lintang menengah: termoklin musiman tumbuh saat pemanasan dan hilang di musim dingin. Sumber data dan gambar: materi Sifat Air Laut (Variasi Suhu Secara Vertikal) 38 / 42", "n": "Ini puncak variabilitas ruang dan waktu pada suhu: di tropis profil relatif stabil sepanjang tahun, di lintang menengah profil berganti mengikuti musim (pemanasan musim semi/panas membentuk termoklin musiman; pengadukan angin kuat dan pendinginan musim dingin menghapusnya), di kutub tidak ada termoklin. Termoklin permanen berada di bawah termoklin musiman."}, {"t": "OTEC: listrik dari selisih suhu laut", "x": "PENERAPAN: ENERGI OTEC: listrik dari selisih suhu laut 1. Evaporator Air permukaan hangat (20–28 °C) menguapkan amonia cair. 2. Turbin Uap amonia memutar turbin dan menghasilkan listrik. 3. Kondensor Air dingin dari termoklin (5–8 °C) mengembunkan uap menjadi cair. 4. Pompa Amonia cair kembali ke evaporator; siklus berulang. 20–28 °C air lapisan permukaan 5–8 °C air lapisan termoklin 15–20 °C selisih suhu di tropis dan ekuator Sumber data: materi Sifat Air Laut (OTEC, Ocean Thermal Energy Conversion) 39 / 42", "n": "Contoh bahwa variabilitas vertikal suhu bukan sekadar fakta ilmiah, tetapi dapat dimanfaatkan. OTEC memerlukan selisih suhu besar antara air permukaan dan air dalam, sehingga cocok di perairan tropis. Bisa dikaitkan dengan tugas pada materi: contoh pemanfaatan air laut untuk energi, pangan, dan obat-obatan."}, {"t": "Densitas: suhu, salinitas, dan tekanan", "x": "DENSITAS Densitas: suhu, salinitas, dan tekanan Suhu turun: air makin rapat, densitas naik. Salinitas naik: lebih banyak garam, densitas naik. Tekanan naik (makin dalam): densitas naik, dan di lapisan dalam efeknya lebih besar daripada suhu dan salinitas. Di permukaan, efek suhu lebih dominan daripada salinitas. Piknoklin adalah lapisan tempat densitas berubah cepat menurut kedalaman. PEMBAGIAN VOLUME LAUT Lapisan permukaan: 2% sekitar 100 m teratas, paling variabel Piknoklin: 18% lapisan transisi ke arah dalam Lapisan dalam: 80% dingin, padat, dan perubahannya lambat Sumber data: materi Sifat Air Laut (Densitas; Kostka, 2002). Proporsi volume dari materi, gambar tidak berskala. 40 / 42", "n": "Densitas jarang diamati langsung; ia dihitung dari suhu, salinitas, dan tekanan. Karena variasi suhu dan salinitas di permukaan kecil dalam angka mutlak (densitas sekitar 1,02–1,03 g/cm3), oseanografer memakai parameter sigma-t. Pembagian volume (2%, 18%, 80%) menunjukkan bahwa sebagian besar laut berada di lapisan dalam yang jarang tersentuh angin."}, {"t": "Stabilitas kolom air dan asal air dalam", "x": "DENSITAS · KOLOM AIR Stabilitas kolom air dan asal air dalam Stabil air ringan air berat Densitas bertambah ke bawah: lapisan bertahan dan sulit bercampur. Tidak stabil air berat air ringan Air berat di atas air ringan: kolom terjungkir, air berat tenggelam. Asal air dalam Air lintang tinggi tenggelam: penggerak sirkulasi termohalin. Sumber data dan gambar: materi Sifat Air Laut (Stabilitas Kolom Air; Densitas). Dua diagram kiri skematis. 41 / 42", "n": "Stabilitas dinyatakan lewat laju perubahan densitas terhadap kedalaman; bila densitas bertambah ke bawah, kolom air stabil. Slide ini menutup lingkaran: densitas (sifat air laut) menjelaskan 90% air laut yang bergerak di bawah piknoklin (materi arus). Air lapisan dalam berasal dari permukaan lintang tinggi yang dingin lalu menjadi berat dan tenggelam. Bila ada waktu, hubungkan dengan tugas membuat resume frekuensi Brunt-Väisälä dari materi."}, {"t": "Variabilitas sebagai benang merah", "x": "RINGKASAN Variabilitas sebagai benang merah Materi Variabilitas spasial Variabilitas temporal Pasut Tipe pasut berbeda tiap lokasi; titik amphidromik Jam, spring-neap (bulan), siklus 18,6 tahun Arus Gyre: sisi barat cepat, sisi timur lambat; muara: permukaan dan dasar berbeda Jam (pasut), musim (monsun), dekade (gyre) Gelombang Berubah dari laut lepas ke pantai; tanjung dan teluk berbeda Detik–menit (periode); badai menjadi alun berhari-hari kemudian Salinitas dan suhu Antar lintang dan antar kedalaman Musiman: termoklin musiman, pola suhu bergeser Sebelum menyimpulkan satu nilai, tanyakan: di mana, kapan, dan pada kedalaman berapa? Variabilitas dalam Oseanografi 42 / 42", "n": "Penutup (sekitar 3 menit). Tabel ini merangkum seluruh sesi lewat satu kerangka. Ajak peserta mengisi satu baris sendiri dengan contoh dari pengalaman mereka (misalnya pantai yang mereka kenal). Pertanyaan di bagian bawah adalah kalimat pegangan yang dibawa pulang."}], [{"t": "Sampul", "x": "MODUL 1 DARI 3 · PENGOLAHAN DATA OSEANOGRAFI Pengolahan Data Pasang Surut (Pasut) Dari observasi elevasi muka air hingga datum pelabuhan: metodologi sensor, quality control, analisis harmonik, dan pelaporan. 1.1 Sensor 1.2 QC & Filter 1.3 Harmonik 1.4 Datum 1.5 Pelaporan Selanjutnya dalam seri ini: Modul 2 — Gelombang · Modul 3 — Arus", "n": ""}, {"t": "Tujuan Pembelajaran", "x": "PENDAHULUAN Tujuan Pembelajaran 1 Memahami metode observasi Menjelaskan cara kerja dan potensi error palem pasut, sensor tekanan, dan sensor radar/akustik. 2 Melakukan QC data pasut Mengidentifikasi spike, drift, dan data hilang, serta menerapkan filtering & resampling yang tepat. 3 Menerapkan analisis harmonik Merekonstruksi pasut dari komponen M2, S2, K1, O1, N2, P1 dan mengevaluasi residualnya. 4 Menghitung datum & melapor Menentukan HHWL, MHWL, MSL, MLWL, LLWL, tidal range, dan menyusun laporan pasut. Modul 1 · Pengolahan Data Pasang Surut (Pasut) 2", "n": ""}, {"t": "Peta Materi: Lima Tahapan Pengolahan Pasut", "x": "PENDAHULUAN Peta Materi: Lima Tahapan Pengolahan Pasut 1.1 Metodologi & Sensor → 1.2 QC & Filtering → 1.3 Analisis Harmonik → 1.4 Datum Elevasi → 1.5 Visualisasi & Pelaporan Setiap tahap membangun input untuk tahap berikutnya: sensor yang tepat → data bersih → model harmonik yang valid → datum yang akurat → laporan yang kredibel. Modul 1 · Pengolahan Data Pasang Surut (Pasut) 3", "n": ""}, {"t": "Metodologi Observasi & Sensor", "x": "1.1 MODUL 1 · PASANG SURUT Metodologi Observasi & Sensor Tiga metode utama pengukuran elevasi muka air laut Palem pasut manual — pengamatan visual langsung, rawan human error Sensor tekanan — mengukur hidrostatik di dasar air, dikonversi ke elevasi Sensor radar/akustik — mengukur jarak pantulan gelombang secara kontinu Modul 1 · Pengolahan Data Pasang Surut (Pasut) 4", "n": ""}, {"t": "Tiga Metode Pengukuran Elevasi Muka Air", "x": "1.1 · METODOLOGI & SENSOR Tiga Metode Pengukuran Elevasi Muka Air 1 Palem Pasut Manual Tide Gauge Staff Pengamatan visual langsung pada skala ukur. Potensi Error: Human error, kesalahan paralaks, keterbatasan pengamatan saat cuaca buruk/malam hari. 2 Sensor Tekanan Pressure Sensor / Tide Logger Mengukur tekanan hidrostatik di dasar air, dikonversi ke elevasi. Potensi Error: Perubahan tekanan atmosfer, kemiringan alat, ketidakakuratan konversi densitas air laut. 3 Sensor Radar / Akustik Radar & Ultrasonic Sensor Mengukur jarak pantulan gelombang dari sensor ke permukaan air secara kontinu. Potensi Error: Pemasangan tidak tegak lurus (miring), hamburan akibat gelombang permukaan (wind waves). Modul 1 · Pengolahan Data Pasang Surut (Pasut) 5", "n": ""}, {"t": "Palem Pasut Manual", "x": "1 Palem Pasut Manual Tide Gauge Staff Pengamatan visual langsung pada skala ukur. Potensi Error: Human error, kesalahan paralaks, keterbatasan pengamatan saat cuaca buruk/malam hari.", "n": ""}, {"t": "Sensor Tekanan", "x": "2 Sensor Tekanan Pressure Sensor / Tide Logger Mengukur tekanan hidrostatik di dasar air, dikonversi ke elevasi. Potensi Error: Perubahan tekanan atmosfer, kemiringan alat, ketidakakuratan konversi densitas air laut.", "n": ""}, {"t": "Prinsip Sensor Tekanan (Pressure Sensor)", "x": "1.1 · METODOLOGI & SENSOR Prinsip Sensor Tekanan (Pressure Sensor) P = ρ · g · h + Patm Tekanan yang terukur sensor = tekanan hidrostatik kolom air + tekanan atmosfer P — Tekanan terukur sensor (Pa) ρ — Densitas air laut (~1025 kg/m³) g — Percepatan gravitasi (9.81 m/s²) h — Tinggi kolom air di atas sensor (m) Patm — Tekanan atmosfer saat pengukuran (Pa) Kenapa perlu koreksi? • Tekanan atmosfer berubah dari hari ke hari — harus dikoreksi dengan data barometer agar tidak dibaca sebagai perubahan muka air. • Densitas air laut (ρ) bervariasi terhadap salinitas & suhu — nilai yang tidak akurat menggeser seluruh hasil konversi h. • Kemiringan alat mengubah kedalaman efektif sensor terhadap dasar — perlu verifikasi saat pemasangan. Modul 1 · Pengolahan Data Pasang Surut (Pasut) 8", "n": ""}, {"t": "Sensor Radar / Akustik", "x": "3 Sensor Radar / Akustik Radar & Ultrasonic Sensor Potensi Error: Pemasangan tidak tegak lurus (miring), hamburan akibat gelombang permuakaan (wind waves).", "n": ""}, {"t": "Quality Control & Pembersihan Data", "x": "1.2 MODUL 1 · PASANG SURUT Quality Control & Pembersihan Data Memastikan data kontinu, konsisten, dan bebas noise sebelum dianalisis Identifikasi spike/blink, drift/trend, dan data hilang (missing) Resampling ke interval teratur (mis. 1 jam) untuk analisis harmonik Filtering moving average tanpa memotong puncak pasut Modul 1 · Pengolahan Data Pasang Surut (Pasut) 10", "n": ""}, {"t": "Identifikasi Kesalahan pada Data Mentah", "x": "1.2 · QC & FILTERING Identifikasi Kesalahan pada Data Mentah Spike / Blink Data melonjak drastis secara tiba-tiba akibat gangguan sensor. Drift / Trend Sensor bergeser/tenggelam perlahan sehingga garis dasar elevasi berubah. Data Hilang (Missing) Baterai habis atau sensor hang, menyebabkan jeda rekaman. Modul 1 · Pengolahan Data Pasang Surut (Pasut) 11", "n": ""}, {"t": "Prosedur Filtering & Resampling", "x": "1.2 · QC & FILTERING Prosedur Filtering & Resampling Langkah-langkah: 1. Resampling: jika interval sampling tidak teratur, samakan menjadi interval 1 jam untuk analisis harmonik standar. 2. Filtering (moving average): buang variasi gelombang angin bertempo singkat dengan jendela waktu yang wajar. 3. Syarat anti-over-smoothing: filter hanya boleh membuang noise periode pendek — TIDAK memotong/mendempet puncak pasut. Contoh di kiri: jendela ~1 jam menjaga bentuk puncak, jendela ~6 jam justru memotong tinggi pasang. Modul 1 · Pengolahan Data Pasang Surut (Pasut) 12", "n": ""}, {"t": "Analisis Harmonik & Rekonstruksi", "x": "1.3 MODUL 1 · PASANG SURUT Analisis Harmonik & Rekonstruksi Membongkar pasut menjadi k iltering (resampling, MA) → Analisis Harmonik → Datum Elevasi → Laporan Pasut Contoh studi kasus (data sintetis 30 hari): tidal range 4,52 m, MSL 2,50 m, didominasi komponen M2 (amplitudo 1,20 m) — tipe pasut campuran condong semidiurnal, RMSE model 1,2% (layak dipakai). Modul 1 · Pengolahan Data Pasang Surut (Pasut) 29", "n": ""}, {"t": "Ringkasan & Tugas", "x": "PENUTUP · MODUL 1 Ringkasan & Tugas Tiga hal yang wajib dikuasai: 1. Menilai kualitas data pasut mentah dan menerapkan QC/filtering yang benar. 2. Melakukan rekonstruksi harmonik dan mengevaluasi residual model. 3. Menghitung datum elevasi dan menyajikannya dalam laporan yang lengkap. 4. https://fkhadami.github.io 5. https://data.mendeley.com/datasets/h5smxr3kbk/1 Tugas Praktikum Diberikan satu set data pasut mentah (30 hari, interval 10 menit), mahasiswa diminta: • Melakukan QC dan filtering data • Melakukan rekonstruksi harmonik dan evaluasi residual • Menghitung datum elevasi dan menyusun laporan singkat Selanjutnya: Modul 2 — Pengolahan Data Gelombang.", "n": ""}], [{"t": "Sampul", "x": "MODUL 3 DARI 3 · PENGOLAHAN DATA OSEANOGRAFI Pengolahan Data Arus Dari konversi vektor hingga current rose: sensor & konversi koordinat, teknik perata-rataan, matriks distribusi frekuensi, visualisasi, dan pelaporan. 3.1 Sensor & Vektor 3.2 Averaging 3.3 Matriks Frekuensi 3.4 Visualisasi 3.5 Pelaporan Sebelumnya: Modul 1 — Pasang Surut · Modul 2 — Gelombang · Modul terakhir dalam seri ini", "n": ""}, {"t": "Tujuan Pembelajaran", "x": "PENDAHULUAN Tujuan Pembelajaran 1 Memahami sensor & konversi vektor Menjelaskan tipe sensor arus (ADCP/ADV vs current meter) dan mengonversi Magnitude/Direction ke komponen u,v. 2 Menerapkan teknik averaging yang benar Melakukan perata-rataan temporal (burst) dan spasial (depth-averaged) pada komponen u,v, bukan pada S. 3 Menyusun matriks & Current Rose Membangun tabel silang kecepatan vs arah tujuan arus (16 sektor) dan memvisualisasikannya sebagai Current Rose. 4 Menginterpretasi & mela asil. Modul 5 · Suhu, Salinitas, dan Densitas 1", "n": ""}, {"t": "Peta Materi: Lima Tahapan Pengolahan Data Kualitas Air", "x": "PENDAHULUAN Peta Materi: Lima Tahapan Pengolahan Data Kualitas Air 5.1 Instrumen & Metode Ukur → 5.2 Dari Ukuran ke Salinitas/Densitas → 5.3 QC Data CTD → 5.4 Profil Vertikal & Stratifikasi → 5.5 Sebaran Spasial & Pelaporan Setiap tahap membangun input untuk tahap berikutnya: instrumen yang tepat → besaran turunan yang benar → data bersih → profil yang valid → laporan yang kredibel. Modul 5 · Suhu, Salinitas, dan Densitas 2", "n": ""}, {"t": "Instrumen & Metode Pengukuran", "x": "5.1 MODUL 5 · SUHU, SALINITAS & DENSITAS Instrumen & Metode Pengukuran Dua pendekatan: pengukuran langsung dengan CTD dan sampel diskrit dengan botol Nansen CTD mengukur Conductivity, Temperature, Depth secara langsung dan kontinu Botol Nansen horizontal mengambil sampel air pada dua kedalaman kritis Depth sounder menentukan kedalaman total (z) sebagai acuan titik sampel Modul 5 · Suhu, Salinitas, dan Densitas 3", "n": ""}, {"t": "Tiga Instrumen Utama Pengukuran Kualitas Air", "x": "5.1 · INSTRUMEN & METODE Tiga Instrumen Utama Pengukuran Kualitas Air SwiFT CTD Valeport Mengukur konduktivitas, suhu, dan kedalaman secara langsung; dilengkapi modul GNSS untuk geo-lokasi tiap profil. Botol Nansen Horizontal Mengambil sampel air pada kedalaman 0.8z (dekat dasar) dan 0.2z (dekat permukaan) tanpa kontaminasi. Depth Sounder Mengukur kedalaman total kolom air (z) di tiap titik sebagai acuan penentuan kedalaman sampel. Modul 5 · Suhu, Salinitas, dan Densitas 4", "n": ""}, {"t": "Prinsip Kerja CTD dan Prosedur Deployment", "x": "5.1 · INSTRUMEN & METODE Prinsip Kerja CTD dan Prosedur Deployment Yang Diukur Langsung vs Diturunkan Diukur langsung sensor: Konduktivitas (C), Suhu (T), Kedalaman/Tekanan (D) Diturunkan (dihitung): Salinitas, Densitas, dan Kecepatan Suara — menggunakan algoritma standar UNESCO dan persamaan Chen & Millero. Prosedur Deployment CTD: 1. Diturunkan/dinaikkan dengan laju 1 meter/detik. 2. Ditahan pada kedalaman 1 m selama 1 menit sebelum diturunkan lebih lanjut, untuk stabilisasi sensor. 3. Kedalaman total (z) diukur dengan depth sounder sebagai acuan titik sampling. Titik Sampel Botol Nansen Botol Nansen horizontal digunakan untuk mengambil sampel air pada dua kedalaman kritis, guna verifikasi/kalibrasi hasil CTD: • 0.2z — dekat permukaan • 0.8z — dekat dasar dengan z = kedalaman total kolom air di lokasi tersebut. Botol dipicu (triggered) menutup pada kedalaman target, menjebak sampel dari lapisan tersebut tanpa kontaminasi dari lapisan lain. Modul 5 · Suhu, Salinitas, dan Densitas 5", "n": ""}, {"t": "Dari Pengukuran ke Salinitas & Densitas", "x": "5.2 MODUL 5 · SUHU, SALINITAS & DENSITAS Dari Pengukuran ke Salinitas & Densitas Dua besaran turunan dihitung dari konduktivitas, suhu, dan tekanan Salinitas: dari rasio konduktivitas via algoritma UNESCO PSS-78 Densitas: fungsi dari salinitas, suhu, dan tekanan (persamaan keadaan air laut) Kedua besaran ini saling terkait — densitas TIDAK diukur langsung Modul 5 · Suhu, Salinitas, dan Densitas 6", "n": ""}, {"t": "Dari Konduktivitas ke Salinitas (PSS-78)", "x": "5.2 · PERHITUNGAN Dari Konduktivitas ke Salinitas (PSS-78) C Konduktivitas mS/cm T Suhu °C P Tekanan dbar + + → Algoritma UNESCO Practical Salinity Scale 1978 (PSS-78) S = f(RT, T) dengan RT = C(S,T,0) / C(35,15,0) Salinitas bukan hasil pengukuran langsung, melainkan hasil perhitungan dari rasio konduktivitas terukur (S, T, P) terhadap konduktivitas larutan standar (35 psu, 15°C, tekanan atmosfer), menggunakan polinomial empiris standar internasional (PSS-78). Unit hasil: psu (practical salinity unit), tanpa dimensi. Modul 5 · Suhu, Salinitas, dan Densitas 7", "n": ""}, {"t": "Dari Salinitas, Suhu, Tekanan ke Densitas", "x": "5.2 · PERHITUNGAN Dari Salinitas, Suhu, Tekanan ke Densitas ρ = ρ(S, T, P) — Persamaan Keadaan Air Laut (UNESCO EOS-80 / Chen & Millero, 1977) Pendekatan Linear untuk Intuisi Arah Perubahan: Δρ ≈ βS · ΔS − αT · ΔT βS: koefisien kontraksi haline (ρ naik saat S naik) · αT: koefisien ekspansi termal (ρ turun saat T naik). Nilai ρ akurat tetap dihitung via polinomial UNESCO EOS-80, bukan bentuk linear ini. Notasi Praktis: Sigma-t (σt) σt = ρ(S,T,0) − 1000 Karena densitas air laut selalu berkisar ~1000–1050 kg/m³, laporan sering memakai σt agar angka lebih ringkas dibaca (mis. ρ = 1021.2 → σt = 21.2). Ingat: densitas TIDAK diukur sensor — selalu turunan dari S, T, P yang sudah dihitung/diukur. Modul 5 · Suhu, Salinitas, dan Densitas 8", "n": ""}, {"t": "Quality Control Data CTD", "x": "5.3 MODUL 5 · SUHU, SALINITAS & DENSITAS Quality Control Data CTD Memastikan profil bersih dan terkalibrasi sebelum dianalisis Despiking — membuang lonjakan akibat gangguan sensor Koreksi thermal-lag — menyelaraskan downcast dan upcast Kalibrasi silang terhadap sampel diskrit botol Nansen Modul 5 · Suhu, Salinitas, dan Densitas 9", "n": ""}, {"t": "Tiga Pemeriksaan QC Wajib pada Data CTD", "x": "5.3 · QC DATA CTD Tiga Pemeriksaan QC Wajib pada Data CTD Modul 5 · Suhu, Salinitas, dan Densitas 10", "n": ""}, {"t": "Profil Vertikal & Stratifikasi", "x": "5.4 MODUL 5 · SUHU, SALINITAS & DENSITAS Profil Vertikal & Stratifikasi Membaca bentuk profil kedalaman untuk menilai lapisan kolom air Thermocline, halocline, pycnocline — tiga wajah dari satu stratifikasi Ambang umum: dT/dz ≈ 0.1°C/m (1°C per 10 m) Kolom tercampur baik (well-mixed) bila gradien di bawah ambang Modul 5 · Suhu, Salinitas, dan Densitas 11", "n": ""}, {"t": "Konsep Stratifikasi: Thermocline, Halocline, Pycnocline", "x": "5.4 · PROFIL VERTIKAL Konsep Stratifikasi: Thermocline, Halocline, Pycnocline Modul 5 · Suhu, Salinitas, dan Densitas 12", "n": ""}, {"t": "Contoh Profil Bersih: Angka Mengikuti Hasil Survey Nyata", "x": "5.4 · PROFIL VERTIKAL Contoh Profil Bersih: Angka Mengikuti Hasil Survey Nyata Bentuk kurva hampir vertikal pada ketiga panel menandakan kolom air homogen — perubahan kecil (ΔT<1°C, ΔS<1 psu, Δρ≈1 kg/m³) di bawah ambang stratifikasi signifikan. Modul 5 · Suhu, Salinitas, dan Densitas 13", "n": ""}, {"t": "Studi Kasus Nyata: Profil Suhu 19 Stasiun CTD", "x": "5.4 · PROFIL VERTIKAL Studi Kasus Nyata: Profil Suhu 19 Stasiun CTD DATA SURVEY NYATA Apa yang Ditunjukkan • 19 profil CTD dari satu survey met-ocean, kedalaman hingga ~20 m, suhu permukaan ~28.1°C turun ke ~27.5°C di dasar. • Seluruh profil hampir lurus (vertikal) — tidak ada gradien tajam yang menandakan thermocline. • Kesimpulan lapangan: kedalaman perairan yang relatif dangkal mendorong pengadukan menyeluruh (well-mixed), sehingga tidak terjadi stratifikasi suhu yang signifikan. • Pola serupa berlaku pada profil salinitas dan densitas di titik yang sama — dibahas pada slide berikut. Modul 5 · Suhu, Salinitas, dan Densitas 14", "n": ""}, {"t": "Sebaran Spasial & Pelaporan", "x": "5.5 MODUL 5 · SUHU, SALINITAS & DENSITAS Sebaran Spasial & Pelaporan Melengkapi profil vertikal dengan gambaran horizontal di tiap kedalaman Peta kontur di beberapa kedalaman: permukaan, tengah, dasar Tabel ringkasan rentang nilai wajib disertakan dalam laporan Interpretasi akhir: apakah kolom air terstratifikasi atau tercampur Modul 5 · Suhu, Salinitas, dan Densitas 15", "n": ""}, {"t": "Sebaran Spasial Suhu pada Tiga Kedalaman", "x": "5.5 · SEBARAN SPASIAL Sebaran Spasial Suhu pada Tiga Kedalaman Permukaan (1 m) Tengah (10 m) Dekat Dasar (16 m) Permukaan: 27.8–28.2°C, lebih hangat di lepas pantai. Kedalaman 10 m & 16 m: kisaran menyempit (27.4–27.7°C) dan makin seragam — menandakan pengadukan vertikal yang kuat. Modul 5 · Suhu, Salinitas, dan Densitas 16", "n": ""}, {"t": "Sebaran Spasial Salinitas pada Tiga Kedalaman", "x": "5.5 · SEBARAN SPASIAL Sebaran Spasial Salinitas pada Tiga Kedalaman Permukaan (1 m) Tengah (10 m) Dekat Dasar (16 m) Permukaan: salinitas lebih rendah dekat pantai (32.4 psu) naik ke lepas pantai (33.02 psu) akibat input air tawar dari sungai. Kedalaman 16 m: seragam 33.1–33.2 psu di seluruh area. Modul 5 · Suhu, Salinitas, dan Densitas 17", "n": ""}, {"t": "Sebaran Spasial Densitas pada Tiga Kedalaman", "x": "5.5 · SEBARAN SPASIAL Sebaran Spasial Densitas pada Tiga Kedalaman Permukaan (1 m) Tengah (10 m) Dekat Dasar (16 m) Pola densitas mengikuti kombinasi suhu dan salinitas: 1020.4–1020.9 kg/m³ di permukaan hingga 1021.1–1021.2 kg/m³ di dasar. Selisih total hanya ~1 kg/m³ — jauh di bawah rentang air tawar–laut (1000–1050 kg/m³). Modul 5 · Suhu, Salinitas, dan Densitas 18", "n": ""}, {"t": "Tabel Ringkasan Wajib Dilaporkan", "x": "5.5 · SEBARAN SPASIAL Tabel Ringkasan Wajib Dilaporkan Rentang nilai per kedalaman dari studi kasus survey met-ocean di atas. Kedalaman Suhu Salinitas Densitas Permukaan (1 m) 27.8 – 28.2 °C 32.4 – 33.02 psu 1020.4 – 1020.9 kg/m³ Tengah (10 m) 27.5 – 27.7 °C 32.96 – 33.2 psu 1020.9 – 1021.2 kg/m³ Dekat Dasar (16 m) 27.4 – 27.6 °C 33.1 – 33.2 psu 1021.1 – 1021.2 kg/m³ Wajib disampaikan dalam laporan: • Rentang nilai per kedalaman (seperti tabel di atas), bukan hanya nilai rata-rata tunggal. • Selisih vertikal (Δ) dan horizontal masing-masing parameter, dibandingkan terhadap ambang stratifikasi. • Kesimpulan status kolom air: terstratifikasi atau tercampur baik (well-mixed), beserta kemungkinan penyebabnya (kedalaman, input sungai, musim). Modul 5 · Suhu, Salinitas, dan Densitas 19", "n": ""}, {"t": "Interpretasi: Kolom Air Tercampur Baik (Well-Mixed)", "x": "5.5 · SEBARAN SPASIAL Interpretasi: Kolom Air Tercampur Baik (Well-Mixed) ΔT total < 0.5 °C ΔS total < 1 psu Δρ total ≈ 1 kg/m³ Kesimpulan Interpretasi Variasi suhu, salinitas, dan densitas di seluruh kedalaman dan area survey berada jauh di bawah ambang stratifikasi signifikan. Kolom air tergolong stabil dan tercampur baik, tanpa thermocline, halocline, atau pycnocline yang nyata. Penyebab paling mungkin: kedalaman perairan yang relatif dangkal (~20 m) mendorong pengadukan vertikal oleh gelombang dan arus, sehingga mendominasi efek pemanasan permukaan dan input air tawar dari sungai yang debitnya rendah. Modul 5 · Suhu, Salinitas, dan Densitas 20", "n": ""}, {"t": "Alur Kerja Lengkap: dari Instrumen hingga Laporan", "x": "RINGKASAN Alur Kerja Lengkap: dari Instrumen hingga Laporan CTD & Sampel Nansen → Hitung S & ρ (UNESCO EOS-80) → QC: Despiking, Lag → Profil & Spasial → Interpretasi & Laporan Contoh studi kasus nyata (survey met-ocean, 19 titik CTD): suhu 27.4–28.2°C, salinitas 32.4–33.2 psu, densitas 1020.4–1021.2 kg/m³ — kolom air tercampur baik, tanpa stratifikasi signifikan pada kedalaman ~20 m. Modul 5 · Suhu, Salinitas, dan Densitas 21", "n": ""}, {"t": "Ringkasan & Tugas", "x": "PENUTUP · MODUL 5 Ringkasan & Tugas Tiga hal yang wajib dikuasai: 1. Menjelaskan bagaimana salinitas dan densitas diturunkan dari konduktivitas, suhu, dan tekanan. 2. Melakukan QC data CTD: despiking, koreksi thermal-lag, kalibrasi terhadap sampel Nansen. 3. Menafsirkan profil vertikal & sebaran spasial untuk menyimpulkan status stratifikasi kolom air. Tugas Praktikum Diberikan satu set data CTD mentah (profil suhu & konduktivitas per kedalaman), mahasiswa diminta: • Melakukan despiking dan koreksi thermal-lag • Menghitung salinitas dan densitas • Menentukan status stratifikasi kolom air dan menyusun laporan singkat Selesai — melengkapi seri Modul 1–5 Pengolahan Data Oseanografi.", "n": ""}], [{"t": "Sampul", "x": "MODUL 4 · PAKET LAPORAN SURVEY OSEANOGRAFI Pelaporan Survey dan Data Oseanografi Pasang surut · gelombang · arus · suhu-salinitas — dari pemilihan lokasi hingga sintesis hasil, dengan satu studi kasus survey met-ocean nyata (Lokasi X, 2024; nama lokasi dan koordinat dirahasiakan). 1. Lokasi 2. Metode & Skenario 3. Hasil per Parameter 4. Sintesis 5. Kesimpulan & QC Melengkapi Modul 1 Pasang Surut · Modul 2 Gelombang · Modul 3 Arus · Modul 5 Suhu, Salinitas & Densitas 1", "n": ""}, {"t": "Mengapa Pelaporan yang Baik Itu Penting?", "x": "PENDAHULUAN Mengapa Pelaporan yang Baik Itu Penting? 1 Bukti keandalan data Laporan yang jelas membuktikan menjaga kerahasiaan data. 4", "n": ""}, {"t": "Lokasi Survey", "x": "1 PELAPORAN SURVEY OSEANOGRAFI Lokasi Survey Apa yang perlu diperhatikan sebelum menentukan titik, dan bagaimana menyajikannya di laporan Kriteria keterwakilan, kedalaman, dan bebas gangguan Peta regional + peta layout titik ukur dari citra/peta asli Anatomi peta yang bisa dipertanggungjawabkan 5", "n": ""}, {"t": "Kriteria Pemilihan Lokasi Pengukuran", "x": "1 · LOKASI SURVEY Kriteria Pemilihan Lokasi Pengukuran 1 Keterwakilan Mewakili kondisi oseanografi area kajian (mulut pelabuhan, tapak proyek, rencana outfall), bukan area yang menyimpang secara lokal. 2 Kedalaman mencukupi Sensor tidak kering saat surut terendah, tetapi tidak terlalu dangkal hingga terganggu gelombang pecah. 3 Bebas gangguan aktivitas Jauh dari jalur kapal, tambatan, atau aktivitas yang berisiko merusak alat — di studi kasus, tide gauge berhenti karena tertabrak kapal. 4 Eksposur sesuai tujuan Terbuka terhadap fetch/arus yang relevan untuk gelombang & arus; minim seiche/resonansi lokal untuk pasut. 5 Aksesibilitas & keamanan Mudah dijangkau untuk pemasangan, pemeliharaan berkala, dan pengambilan data, dengan keselamatan tim terjaga. 6 Dekat referensi geodetik (BM) Terutama untuk pasut — memudahkan pengikatan datum pengukuran ke datum vertikal nasional. 6", "n": ""}, {"t": "Peta Regional: Menempatkan Lokasi dalam Konteks", "x": "1 · LOKASI SURVEY Peta Regional: Menempatkan Lokasi dalam Konteks CONTOH · LOKASI ILUSTRASI Contoh penyajian dengan lokasi ilustrasi (pesisir Cirebon) — lokasi studi kasus dirahasiakan. Garis pantai: Natural Earth 1:10 juta. Laporan studi kasus belum memuat peta jenis ini. Menjawab ‘di mana?’ Pembaca dari luar daerah dapat menempatkan lokasi tanpa mengenal wilayahnya. Grid koordinat + datum Lintang–bujur atau UTM, disertai datum (WGS 84) dan proyeksi. Sumber peta disebut Garis pantai, batas wilayah, dan citra diberi sumber dan tahun. 7", "n": ""}, {"t": "Peta Layout Titik Ukur: Contoh dari Laporan Nyat
