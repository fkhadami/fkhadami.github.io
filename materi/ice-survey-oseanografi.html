ernal; sampel botol Nansen di 0,2z dan 0,8z. METEOROLOGI AWS Davis Vantage Pro 2 Angin, suhu udara, kelembapan, hujan, tekanan udara; interval 15 menit, tiang 5 m. 11", "n": ""}, {"t": "Dokumentasi Pemasangan di Lapangan", "x": "2 · METODE DAN ALAT Dokumentasi Pemasangan di Lapangan DATA NYATA · STUDI KASUS Tide pole untuk kalibrasi datum offset tide gauge ADCP pada rangka tetap, diturunkan dengan bantuan penyelam Persiapan CTD dan sampel air di atas perahu AWS terpasang pada tiang setinggi ±5 m Foto saja belum cukup: pasangkan setiap foto dengan formulir deployment/retrieval — waktu, koordinat, kedalaman, nomor seri alat, dan kondisi cuaca saat pemasangan. 12", "n": ""}, {"t": "Durasi, Interval, dan Titik Kritis per Parameter", "x": "2 · SKENARIO SURVEY Durasi, Interval, dan Titik Kritis per Parameter Parameter Interval rekam Durasi minimal Durasi ideal Titik kritis Pasut 10–30 menit 15 hari 29–30 hari (siklus spring–neap) Levelling ke BM di awal & akhir Gelombang Burst 1–4 Hz (jendela 2–30 menit) Beberapa minggu Musiman / tahunan Interval burst, kedalaman sensor, data angin Arus 10–30 menit 15 hari 29–30 hari, selaras pasut Profil bin: permukaan, tengah, dasar Suhu-salinitas (CTD) Profil kontinu, turun–naik ±1 m/s 1 kali di semua stasiun Diulang saat pasang & surut Kalibrasi silang dengan sampel Nansen; waktu & posisi GNSS tiap profil Meteorologi (AWS) 10–15 menit Selama pengukuran gelombang Sepanjang survey Tinggi sensor angin (acuan 10 m), area terbuka Baris suhu-salinitas dan meteorologi ditambahkan agar skenario survey mencakup seluruh parameter yang dilaporkan. 13", "n": ""}, {"t": "Skema Sampling Instrumen pada Survey Nyata", "x": "2 · SKENARIO SURVEY Skema Sampling Instrumen pada Survey Nyata DATA NYATA · STUDI KASUS Parameter Instrumen Skema sampling — data nyata Pasut TideMaster tide gauge Burst 40 detik, lalu tidur 10 menit; datum offset dari tide pole; gain factor 0,993 m/dbar Arus (profil) ADCP Sentinel V50, dasar ±12 m 960 ping/ensemble, durasi 8 menit, interval 10 menit; range 20,5 m, sel 1 m (20 sel) Gelombang ADCP Sentinel V50 120 ping/ensemble, durasi 120 detik, interval 10 menit Suhu-salinitas SwiFT CTD + botol Nansen Turun–naik 1 m/s, tahan 1 menit di 1 m; 19 stasiun; sampel 0,2z dan 0,8z Meteorologi AWS Davis Vantage Pro 2 Interval 15 menit; sensor di tiang 5 m, area terbuka Arus sungai Flowatch FL-03 Interval 15 menit selama 2 jam saat surut & pasang, di 2 titik penampang Survey lapangan 26 Jul – 12 Ags 2024; tide gauge tetap terpasang hingga 31 Ags dan dipantau oleh pembantu lokal. 14", "n": ""}, {"t": "Ketersediaan Data: Rencana vs Kenyataan", "x": "2 · SKENARIO SURVEY Ketersediaan Data: Rencana vs Kenyataan DATA NYATA · STUDI KASUS 26 Jul 1 Ags 8 Ags 15 Ags 22 Ags 29 Ags Tide gauge ✕ berhenti 19 Ags: tertabrak kapal ADCP (arus, gelombang, tekanan) AWS meteorologi Batimetri CTD & sampel air* data terekam rencana 30 hari *tanggal mengikuti jadwal sampling air laut pada laporan Laporkan apa adanya: tide gauge hanya merekam ±17 dari 30 hari. Celah ditutup dengan sensor tekanan ADCP (1–11 Ags) sehingga satu siklus spring–neap tercakup, lalu direkonstruksi 30 hari dengan analisis harmonik. Kejadian, dampak, dan cara penanganannya ditulis eksplisit di laporan. 15", "n": ""}, {"t": "Aspek Umum Lintas Parameter", "x": "2 · SKENARIO SURVEY Aspek Umum Lintas Parameter 1 Kalibrasi alat Sertifikat kalibrasi dilampirkan; kalibrasi lapangan (tide pole, barcheck, sampel Nansen) dicatat sebelum & sesudah pengukuran. 2 Keamanan pemasangan Pelampung tanda, koordinasi dengan otoritas pelabuhan dan nelayan setempat, pengamanan dari tabrakan dan pencurian. 3 Dokumentasi lapangan Foto pemasangan & kondisi sekitar; formulir deployment/retrieval lengkap dengan nomor seri alat. 4 Tim & K3 Kompetensi tim (termasuk penyelam bersertifikat untuk alat dasar laut), APD, dan prosedur keselamatan kerja di laut. 16", "n": ""}, {"t": "Hasil per Parameter", "x": "3 PELAPORAN SURVEY OSEANOGRAFI Hasil per Parameter Apa yang wajib disampaikan dari tiap parameter — dengan gambar dari laporan nyata Pasut — QC, penggabungan data, harmonik, Formzahl, datum Gelombang & arus — deret waktu, statistik, rose, profil kedalaman Suhu-salinitas — profil vertikal, sebaran spasial, stratifikasi 17", "n": ""}, {"t": "Pasut: Data Mentah, Celah, dan Penggabungan Dua Sensor", "x": "3 · HASIL PASUT Pasut: Data Mentah, Celah, dan Penggabungan Dua Sensor DATA NYATA · STUDI KASUS (a) Tide gauge, 3–19 Ags (b) Sensor tekanan ADCP, 1–11 Ags (c) Gabungan kedua sensor. Sumber: Laporan Akhir Survey Met-Ocean Lokasi X (2024), Gambar 4.1–4.3. PASUT · QC Apa yang Wajib Dijelaskan Penyebab celah: tide gauge berhenti 19 Ags karena tertabrak kapal — dicatat, bukan disembunyikan. Cara menyamakan acuan kedua sensor (offset datum) sebelum digabung. Periode tumpang-tindih (3–11 Ags) sebagai bukti kedua sensor konsisten. Koreksi tekanan udara (dari AWS) dan densitas air bila sensor mengukur tekanan absolut. 18", "n": ""}, {"t": "Pasut: Analisis Harmonik dan Rekonstruksi 30 Hari", "x": "3 · HASIL PASUT Pasut: Analisis Harmonik dan Rekonstruksi 30 Hari DATA NYATA · STUDI KASUS Observasi vs rekonstruksi harmonik 30 hari. Sumber: Laporan Akhir Survey Met-Ocean Lokasi X (2024), Gambar 4.4. Z0 Q1 O1 P1 K1 N2 M2 S2 K2 A (m) 1,200 0,036 0,208 0,092 0,198 0,091 0,494 0,238 0,308 g (°) — ? ? ? ? ? ? ? ? PASUT · HARMONIK Catatan Evaluasi Tabel konstituen hanya memuat amplitudo — fase (g°) wajib dicantumkan agar prediksi dapat direproduksi. K2 (0,308 m) lebih besar dari S2 (0,238 m), padahal secara teoretis K2 ≈ 0,27 × S2. Dengan data ±19 hari, K2 tidak dapat dipisahkan dari S2 (butuh ±6 bulan) → perlu inferensi dan dicatat sebagai keterbatasan. Cantumkan RMSE residual atau skill rekonstruksi sebagai ukuran kecocokan, bukan hanya ‘terlihat cocok’. 19", "n": ""}, {"t": "Pasut: Tipe Pasut (Formzahl) dan Datum", "x": "3 · HASIL PASUT Pasut: Tipe Pasut (Formzahl) dan Datum DATA NYATA · STUDI KASUS Formzahl dari konstituen hasil analisis F = (A K1 + A O1) / (A M2 + A S2) = (0,198 + 0,208) / (0,494 + 0,238) F = 0,554 → campuran, condong ke harian ganda Datum Elevasi (m) HHWS — Highest High Water Springs 2,338 MHWS — Mean High Water Springs 1,932 MSL — Mean Sea Level 1,200 MLW — Mean Low Water 0,706 MLLW — Mean Lower Low Water 0,300 LLWS — Lowest Low Water Springs 0,062 PASUT · DATA NYATA Apa yang Ditunjukkan F dihitung langsung dari amplitudo hasil analisis harmonik pengamatan lapangan. Tunggang pasut HHWS − LLWS = 2,28 m; MSL = 1,20 m di atas nol alat. Wajib dinyatakan: acuan elevasi (nol tide gauge, LWS, atau datum nasional melalui BM) dan standar perhitungan (NOAA 2001, ICSM 2017). Datum inilah yang dipakai sebagai acuan peta batimetri dan elevasi desain — angkanya harus identik di bab hasil, kesimpulan, dan lampiran. 20", "n": ""}, {"t": "Lima Komponen Wajib Laporan Gelombang", "x": "3 · HASIL GELOMBANG Lima Komponen Wajib Laporan Gelombang 1 Ringkasan eksekutif Hs (rentang & rata-rata), Tp atau Ts, Hmax, dan arah dominan selama periode rekam. 2 Grafik deret waktu Panel bertumpuk H, T, dan arah terhadap waktu — sertakan kedalaman sensor. 3 Tabel distribusi frekuensi Tabel silang kelas Hs × sektor arah (8 atau 16 sektor) dalam persen, lengkap dengan total. 4 Wave rose Visualisasi tabel distribusi; konvensi arah dan kelas Hs tertulis di legenda. 5 Tabel statistik Rata-rata, maksimum, minimum, simpangan baku, dan persentil (mis. Hs90). Definisi yang Harus Konsisten Hs vs H1/3 Hm0 = 4√m0 (spektral) berbeda dari H1/3 (zero-crossing). Sebutkan mana yang dipakai. Tp vs Ts Tp dari puncak spektrum; Ts dari 1/3 gelombang tertinggi. Jangan dipertukarkan. Arah gelombang Konvensi nautika: arah ‘datang dari’, derajat dari utara searah jarum jam. Kedalaman sensor Untuk sensor dasar, tuliskan kedalaman & koreksi atenuasi tekanan. 21", "n": ""}, {"t": "Gelombang: Deret Waktu dari ADCP", "x": "3 · HASIL GELOMBANG Gelombang: Deret Waktu dari ADCP DATA NYATA · STUDI KASUS 0,38–1,00 m rentang Hs 1,48 m Hmax (7 Ags) ±6–7 s Tp dominan* GELOMBANG · EVALUASI Cara membaca (a) Hs, H1/10, H1/3, Hmax · (b) periode · (c) arah · (d) kedalaman air di atas ADCP, yang sekaligus merekam pasut. Perlu diperbaiki Panel (d) menunjukkan ±8,9–10,9 m, sedangkan metode menyebut ADCP di 12 m — jelaskan acuan kedalaman (dasar laut, tinggi rangka, transduser). Hs dan H1/3 ditampilkan bersama tanpa definisi; label tanggal berulang (08-01, 08-01) — pakai format tanggal-jam yang jelas. *dibaca dari panel (b). Sumber: Laporan Akhir Survey Met-Ocean Lokasi X (2024), Gambar 4.9. 22", "n": ""}, {"t": "Wave Rose dan Wind Rose: Arah Dominan", "x": "3 · HASIL GELOMBANG Wave Rose dan Wind Rose: Arah Dominan DATA NYATA · STUDI KASUS Wave rose, 1–11 Ags 2024 (Gambar 4.10) Wind rose, periode yang sama (Gambar 4.12) DATA NYATA Bacaan & Catatan Gelombang dominan dari timur; mayoritas Hs 0,4–0,8 m. Angin dominan dari timur dan barat laut — pola angin darat–laut. Legenda dan label persen terlalu kecil untuk dibaca di laporan cetak. Tuliskan konvensi arah di keterangan gambar: ‘arah datang’ untuk gelombang & angin. Hubungkan keduanya: arah gelombang dominan sejalan dengan angin timur, sehingga gelombang di lokasi terutama dibangkitkan angin lokal. 23", "n": ""}, {"t": "Gelombang dan Meteorologi: Kejadian 7 Agustus", "x": "3 · HASIL GELOMBANG Gelombang dan Meteorologi: Kejadian 7 Agustus DATA NYATA · STUDI KASUS SINTESIS · DATA NYATA Apa yang Ditunjukkan 7 Ags: angin menguat hingga ±12 m/s, suhu udara turun dari pola harian 24–32 °C, kelembapan naik, hujan meningkat. Pada hari yang sama Hs mencapai 1,0 m dan Hmax 1,48 m — puncak gelombang dijelaskan oleh forcing meteorologi. Catatan: anemometer berada di 5 m. Untuk prediksi gelombang, kecepatan angin dikonversi ke 10 m, mis. U10 ≈ U5 × (10/5)^1/7 ≈ 1,10 U5. Sumber: Laporan Akhir Survey Met-Ocean Lokasi X (2024), Gambar 4.11 (panel a–c). 24", "n": ""}, {"t": "Arus: Komponen u–v dan Profil Kecepatan", "x": "3 · HASIL ARUS Arus: Komponen u–v dan Profil Kecepatan DATA NYATA · STUDI KASUS (a) Zonal u (timur–barat) (b) Meridional v (utara–selatan) (c) Rata-rata, maks, min, simpangan baku magnitudo Wajib: u, v per lapisan kedalaman dan statistik magnitudo terhadap kedalaman. Hasil: arus melemah ke dasar hingga ±0,05 m/s. Perbaiki: skala warna (a)–(b) tidak terbaca pada ukuran laporan; teks merujuk ‘Figure 4.3/4.4’ untuk gambar yang diberi nomor 4.5/4.6 — gunakan cross-reference otomatis. 25", "n": ""}, {"t": "Arus: Current Rose di Tiga Kedalaman", "x": "3 · HASIL ARUS Arus: Current Rose di Tiga Kedalaman DATA NYATA · STUDI KASUS Permukaan Tengah Dekat dasar Sumber: Laporan Akhir Survey Met-Ocean Lokasi X (2024), Gambar 4.8. Konvensi arah berbeda! Arus lazim dilaporkan sebagai arah ‘menuju’, sedangkan gelombang dan angin ‘datang dari’. Tuliskan konvensi di setiap keterangan gambar agar pembaca tidak membandingkan arah yang berkebalikan 180°. ARUS · DATA NYATA Apa yang Ditunjukkan Rose disajikan per kedalaman, bukan satu rose gabungan. Permukaan lebih kuat dan bervariasi (0,1 hingga >0,2 m/s); mendekati dasar melemah dan lebih konsisten. Karena survey ini untuk model sebaran polutan, tambahkan arus residual (setelah filter pasut) atau progressive vector diagram. 26", "n": ""}, {"t": "Suhu-Salinitas: Stasiun dan Metode Pengukuran", "x": "3 · HASIL SUHU-SALINITAS Suhu-Salinitas: Stasiun dan Metode Pengukuran DATA NYATA · STUDI KASUS CTD · YANG WAJIB DILAPORKAN Tabel stasiun ID, koordinat, waktu (tanggal–jam), kedalaman total dari depth sounder, dan fase pasut saat pengukuran. Metode Laju turun–naik ±1 m/s, tahan 1 menit di 1 m untuk stabilisasi sensor; profil turun yang dipakai. Sampel Nansen di 0,2z dan 0,8z untuk kalibrasi silang salinitas CTD. Algoritma turunan Salinitas PSS-78 dari C, T, P; densitas EOS-80 (atau TEOS-10 bila memakai SA/CT) — sebutkan, beserta satuan (psu, bukan ‘ppt’). 27", "n": ""}, {"t": "Profil Vertikal Suhu, Salinitas, dan Densitas — 19 Stasiun", "x": "3 · HASIL SUHU-SALINITAS Profil Vertikal Suhu, Salinitas, dan Densitas — 19 Stasiun DATA NYATA · STUDI KASUS Suhu Salinitas Densitas Sumber: Laporan Akhir Survey Met-Ocean Lokasi X (2024), Gambar 4.15–4.17. Saran penyajian: 19 panel kecil dengan sumbu berbeda sulit dibandingkan. Tumpuk semua stasiun dalam satu panel per parameter, sumbu seragam, dan tambahkan profil rata-rata. CTD · DATA NYATA Apa yang Ditunjukkan Kedalaman ±20 m; suhu ±28,1 °C di permukaan dan ±27,5 °C di dasar. Salinitas 32,6–33,1 psu, sedikit lebih rendah di permukaan; lompatan kecil di 6–8 m. Densitas 1020–1021 kg/m³, mengikuti pola salinitas. Tidak ada termoklin: gradien ±0,03 °C/m, jauh di bawah ambang 0,1 °C/m. 28", "n": ""}, {"t": "Sebaran Spasial pada Tiga Kedalaman", "x": "3 · HASIL SUHU-SALINITAS Sebaran Spasial pada Tiga Kedalaman DATA NYATA · STUDI KASUS 1 m 10 m 16 m Suhu Salinitas Densitas EVALUASI PETA Sudah baik Skala warna sama untuk satu parameter di tiga kedalaman; ada grid lintang–bujur (label disamarkan di modul ini). Perbaiki Interpolasi mengisi persegi penuh, termasuk area tanpa stasiun — tampilkan titik stasiun dan batasi ke area data. Teks menyebut salinitas & densitas permukaan lebih rendah dekat pantai; peta menunjukkan nilai terendah di sisi lepas pantai. 29", "n": ""}, {"t": "Tabel Ringkasan dan Interpretasi Stratifikasi", "x": "3 · HASIL SUHU-SALINITAS Tabel Ringkasan dan Interpretasi Stratifikasi DATA NYATA · STUDI KASUS Kedalaman Suhu (°C) Salinitas (psu) Densitas (kg/m³) Permukaan (1 m) 27,8 – 28,2 32,40 – 33,02 1020,4 – 1020,9 Tengah (10 m) 27,5 – 27,7 32,96 – 33,20 1020,9 – 1021,2 Dekat dasar (16 m) 27,4 – 27,6 33,10 – 33,20 1021,1 – 1021,2 ΔT < 1 °C ΔS < 1 psu Δρ < 1 kg/m³ Rentang per kedalaman, bukan hanya satu rata-rata. Selisih seluruh kolom air ±0,8 untuk ketiga parameter — laporan asli menulis ‘ΔT < 0,5 °C’, tidak sesuai tabelnya sendiri. INTERPRETASI Kolom Air Tercampur Baik Variasi suhu, salinitas, dan densitas jauh di bawah ambang stratifikasi: tidak ada termoklin, haloklin, maupun piknoklin. Penyebab yang masuk akal: perairan dangkal (±20 m), pengadukan oleh gelombang dan arus pasut, debit sungai kecil. Implikasi bagi tujuan survey: untuk kondisi saat survey, model sebaran polutan rerata kedalaman (2D) dapat dipertimbangkan — dengan catatan musim. 30", "n": ""}, {"t": "Sintesis Antar-Parameter", "x": "4 PELAPORAN SURVEY OSEANOGRAFI Sintesis Antar-Parameter Bagian hasil ditutup dengan kaitan antar-proses, bukan deretan grafik Kaitan pasut – arus – gelombang – angin Kaitan suhu-salinitas dengan data lain Cek silang kuantitatif antar-instrumen 31", "n": ""}, {"t": "Mengaitkan Pasut, Gelombang, Arus, dan Suhu-Salinitas", "x": "4 · SINTESIS Mengaitkan Pasut, Gelombang, Arus, dan Suhu-Salinitas Pasut Tipe campuran ganda, tunggang 2,28 m ↔ Arus Lemah, melemah ke dasar ↔ Gelombang + angin Dari timur, dibangkitkan angin lokal ↔ Suhu-salinitas Tercampur baik, tanpa stratifikasi Pertanyaan kunci yang harus dijawab eksplisit 1 Apakah arus didominasi komponen pasut, konsisten dengan tipe pasut (Formzahl)? Berapa porsi arus residual? 2 Apakah gelombang dominan sejalan dengan angin dominan, dan bagaimana kejadian ekstrem (7 Ags) tercermin pada keduanya? 3 Apakah kolom air tercampur baik konsisten dengan kekuatan arus & gelombang yang terukur? 4 Apa arti kondisi gabungan ini bagi tujuan survey — misalnya desain outfall dan pilihan model 2D vs 3D? 32", "n": ""}, {"t": "Cek Silang Kuantitatif: Data CTD dan AWS untuk Sensor Tekanan", "x": "4 · SINTESIS Cek Silang Kuantitatif: Data CTD dan AWS untuk Sensor Tekanan DATA NYATA · STUDI KASUS Asumsi laporan 1025,97 kg/m³ (air laut 15 °C) → 0,9936 m per dbar Terukur CTD 1020,4–1021,2 kg/m³ di lokasi → ±0,9986 m per dbar Selisih ≈ 0,5 % ±5 cm pada kolom air 10 m ±1 cm pada tunggang 2,28 m h = Δp / (ρ g) → gain factor bergantung pada densitas air setempat Pelajaran untuk laporan Data satu parameter dapat memverifikasi parameter lain: densitas CTD menguji asumsi gain factor tide gauge & ADCP; tekanan udara AWS (1 hPa ≈ 1 cm) mengoreksi sensor tekanan absolut. Efeknya kecil untuk pasut di sini, tetapi wajib dibahas — atau dinyatakan diabaikan beserta alasannya. 33", "n": ""}, {"t": "Kesimpulan, QC & Lampiran", "x": "5 PELAPORAN SURVEY OSEANOGRAFI Kesimpulan, QC & Lampiran Menutup laporan dengan ringkasan yang jujur, konsisten, dan dapat ditindaklanjuti Isi wajib bagian penutup Cek konsistensi sebelum laporan dikirim Kelengkapan lampiran untuk audit teknis 34", "n": ""}, {"t": "Apa yang Wajib Ada di Bagian Penutup", "x": "5 · KESIMPULAN DAN REKOMENDASI Apa yang Wajib Ada di Bagian Penutup 1 Ringkasan karakteristik Tipe pasut & tunggang, kisaran Hs dan arah dominan, pola arus, status stratifikasi kolom air, serta kondisi angin — singkat, dengan angka yang identik dengan bab hasil. 2 Tingkat keandalan data Durasi efektif tiap alat, kelengkapan data, celah & penanganannya, hasil QC dan kalibrasi — nyatakan batasan secara jujur. 3 Rekomendasi teknis Sesuai tujuan survey: elevasi desain, arah struktur, pilihan model (2D/3D), atau kebutuhan data tambahan (mis. musim lain, durasi pasut 30 hari penuh). 35", "n": ""}, {"t": "Cek Konsistensi Sebelum Laporan Dikirim", "x": "5 · QC LAPORAN Cek Konsistensi Sebelum Laporan Dikirim DATA NYATA · STUDI KASUS Bagian Temuan pada draf laporan studi kasus Perbaikan Kesimpulan Memuat lokasi, periode, dan angka dari survey lain (tunggang pasut 1,53 m; gelombang dari selatan) — bab hasil: 2,28 m; dari timur Tulis kesimpulan paling akhir, langsung dari tabel hasil Rujukan gambar Teks merujuk Gambar 4.3 / 4.7 / 4.12; keterangan gambar bernomor 4.5 / 4.9 / 4.14 Gunakan cross-reference otomatis Metode vs data ADCP disebut di 12 m; sensor tekanannya mencatat ±9–11 m Jelaskan acuan kedalaman Harmonik pasut Tanpa fase; K2 > S2 pada data ±19 hari Sertakan fase & keterbatasan resolusi Suhu-salinitas ‘ΔT < 0,5 °C’ vs tabel 27,4–28,2 °C; arah gradien di teks berlawanan dengan peta; satuan ppt dan psu bercampur Satu tabel ringkasan sebagai sumber semua angka Kesalahan seperti ini tidak terlihat oleh penulis yang mengerjakan bab satu per satu. Minta rekan yang tidak menulis laporan untuk membaca ulang dengan daftar ini. 36", "n": ""}, {"t": "Kelengkapan Lampiran untuk Keperluan Audit Teknis", "x": "5 · LAMPIRAN Kelengkapan Lampiran untuk Keperluan Audit Teknis ✓ Data mentah (atau tautan/media) untuk setiap alat ✓ Sertifikat kalibrasi tiap alat ✓ Formulir deployment/retrieval: waktu, koordinat, kedalaman, nomor seri ✓ Foto dokumentasi lapangan (pemasangan, kondisi sekitar, pengambilan) ✓ Hasil levelling ke benchmark (BM) ✓ Tabel konstituen harmonik lengkap (amplitudo & fase) ✓ Profil CTD per stasiun dan hasil kalibrasi silang sampel Nansen ✓ Data AWS lengkap, termasuk tekanan udara Butir berwarna emas ditambahkan untuk parameter suhu-salinitas dan meteorologi serta hasil evaluasi tabel harmonik. 37", "n": ""}, {"t": "Struktur Laporan Nyata: Bab, Gambar, dan Tabel", "x": "5 · LAMPIRAN Struktur Laporan Nyata: Bab, Gambar, dan Tabel DATA NYATA · STUDI KASUS Bab Isi utama Gambar Tabel 1. Introduction Latar belakang, tujuan, ruang lingkup 1 0 2. Met-ocean Survey Tim, jadwal, metode tiap parameter 13 1 3. Bathymetry Survey Metode, pelaksanaan, pengolahan data 9 0 4. Survey Result Pasut, arus, gelombang, meteorologi, kualitas air, sedimen 21 4 5. Bathymetric Data Representation Profil memanjang & melintang 1 0 Total 5 bab inti + kesimpulan, ±47 halaman 45 5 STRUKTUR · DATA NYATA Pelajaran Setiap metode (Bab 2) diberi 1–2 gambar instrumen — konsisten di semua parameter. Bab hasil paling padat (21 gambar, 4 tabel), sebanding dengan jumlah parameter. Yang belum ada: peta regional, tabel koordinat stasiun, tabel statistik gelombang & arus, dan bab sintesis tersendiri. 38", "n": ""}, {"t": "Ringkasan & Tugas", "x": "PENUTUP Ringkasan & Tugas Lokasi dijustifikasi dengan kriteria dan disajikan dengan peta asli yang lengkap: koordinat, datum, skala, sumber, inset regional. Metode, alat, skenario, dan ketersediaan data aktual didokumentasikan — termasuk celah dan penanganannya. Setiap keluaran (pasut, gelombang, arus, suhu-salinitas) disertai definisi, konvensi, dan penjelasan minimal. Hasil ditutup dengan sintesis dan cek silang antar-instrumen. Sebelum dikirim, setiap angka di kesimpulan dilacak ke tabel atau gambar sumbernya. Tugas Praktikum Ambil satu bab hasil dari laporan studi kasus (atau laporan kelompok Anda): Lakukan cek konsistensi memakai daftar QC pada modul ini. Perbaiki satu peta agar memenuhi enam unsur anatomi peta. Tulis ulang satu paragraf kesimpulan yang setiap angkanya dapat dilacak ke tabel/gambar. 39", "n": ""}]];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const src = (m,s) => `ice-survey-oseanografi/m${m+1}/s-${String(s+1).padStart(2,'0')}.webp`;
let cur = 0, vIdx = 0, notesOn = false;

$('total').textContent = DATA.reduce((a,d)=>a+d.length,0);

function buildNav(){
  $('nav').innerHTML = MODS.map((m,i)=>`
    <div class="mod" data-m="${i}">
      <button class="mod-btn" data-go="${i}">
        <span class="num">${i+1}</span>
        <span><div class="mod-title">${esc(m.title)}</div><div class="mod-meta">${DATA[i].length} slide</div></span>
      </button>
    </div>`).join('');
}

function render(m){
  cur = m;
  const M = MODS[m], S = DATA[m];
  $('eyebrow').textContent = `Materi ${m+1} dari ${MODS.length}`;
  $('mtitle').textContent = M.title;
  $('pp').disabled = m===0; $('pn').disabled = m===MODS.length-1;
  document.querySelectorAll('.mod').forEach(el=>el.classList.toggle('active', +el.dataset.m===m));
  const prev = m>0 ? `<button data-go="${m-1}"><small>← Materi sebelumnya</small>${esc(MODS[m-1].title)}</button>` : '<span></span>';
  const next = m<MODS.length-1 ? `<button data-go="${m+1}"><small>Materi berikutnya →</small>${esc(MODS[m+1].title)}</button>` : '<span></span>';
  $('deck').innerHTML = `<p class="intro">${esc(M.desc)} Klik slide untuk tampilan layar penuh; gunakan tombol panah untuk berpindah.</p>` +
    S.map((s,k)=>`
    <section class="slide" id="s-${m+1}-${k+1}">
      <div class="frame" data-view="${k}"><img data-src="${m}-${k}" width="1600" height="900" alt="${esc(s.t)}"></div>
      <div class="cap"><span class="k">${k+1}/${S.length}</span><span>${esc(s.t)}</span></div>
    </section>`).join('') + `<div class="foot">${prev}${next}</div>`;
}

// Slides are attached when near the viewport.
function loadImg(img, key){ const [m,s]=key.split('-').map(Number); img.src = src(m,s); }
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); loadImg(e.target, e.target.dataset.src); } }), {rootMargin:'1200px 0px'}) : null;
function observeImgs(){ document.querySelectorAll('img[data-src]').forEach(img=> io ? io.observe(img) : loadImg(img, img.dataset.src)); }

function go(m, k, push=true){
  if (m!==cur || !$('deck').children.length){ render(m); observeImgs(); }
  const hash = k==null ? `materi-${m+1}` : `materi-${m+1}-s${k+1}`;
  if (push && location.hash !== '#'+hash) history.replaceState(null,'','#'+hash);
  if (k==null) window.scrollTo({top:0});
  else { const el = document.getElementById(`s-${m+1}-${k+1}`); if (el) el.scrollIntoView({block:'start'}); }
  closeSide();
}

function fromHash(){
  const h = location.hash.slice(1);
  const mm = h.match(/^materi-(\d+)(?:-s(\d+))?$/);
  if (mm){ const m=Math.min(Math.max(+mm[1]-1,0),MODS.length-1); go(m, mm[2]?+mm[2]-1:null, false); }
  else go(0,null,false);
}

// spy current slide in sidebar
const spy = () => {
  const secs = document.querySelectorAll('.slide'); let idx = 0;
  secs.forEach((s,i)=>{ if (s.getBoundingClientRect().top < 160) idx = i; });
  document.querySelectorAll(`.mod[data-m="${cur}"] .slist button`).forEach((b,i)=>b.classList.toggle('cur', i===idx));
};

// Viewer
function openViewer(k){ vIdx = k; $('viewer').classList.add('on'); showV(); }
function showV(){
  const S = DATA[cur], s = S[vIdx];
  $('vimg').src = src(cur,vIdx); $('vimg').alt = s.t;
  $('vt').textContent = `${MODS[cur].title} — ${s.t}`;
  $('vc').textContent = `${vIdx+1} / ${S.length}`;
}
function stepV(d){ const n = vIdx+d; if (n>=0 && n<DATA[cur].length){ vIdx=n; showV(); } }
function closeViewer(){ $('viewer').classList.remove('on'); const el=document.getElementById(`s-${cur+1}-${vIdx+1}`); if(el) el.scrollIntoView({block:'center'}); }

// Search
$('q').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  if (!q){ $('results').classList.remove('on'); $('nav').style.display=''; return; }
  const hits = [];
  DATA.forEach((S,m)=>S.forEach((s,k)=>{ if ((s.t+' '+s.x).toLowerCase().includes(q)) hits.push([m,k,s]); }));
  $('nav').style.display='none'; $('results').classList.add('on');
  $('results').innerHTML = hits.length ? hits.slice(0,80).map(([m,k,s])=>`<button class="r" data-jump="${m}-${k}"><b>${esc(s.t)}</b><span>Materi ${m+1} · slide ${k+1}</span></button>`).join('') : '<div class="empty">Tidak ada slide yang cocok.</div>';
});

// Events
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]'); if (g){ go(+g.dataset.go, null); return; }
  const j = e.target.closest('[data-jump]'); if (j){ const [m,k]=j.dataset.jump.split('-').map(Number); go(m,k); return; }
  const v = e.target.closest('[data-view]'); if (v){ openViewer(+v.dataset.view); return; }
});
$('pp').onclick = ()=>go(cur-1,null); $('pn').onclick = ()=>go(cur+1,null);
$('present').onclick = ()=>openViewer(0);
$('vx').onclick = closeViewer; $('vp').onclick = ()=>stepV(-1); $('vn').onclick = ()=>stepV(1);
$('vimg').onclick = ()=>stepV(1);
document.addEventListener('keydown', e=>{
  if (!$('viewer').classList.contains('on')) return;
  if (['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); stepV(1); }
  else if (['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); stepV(-1); }
  else if (e.key==='Escape') closeViewer();
  else if (e.key==='Home'){ vIdx=0; showV(); } else if (e.key==='End'){ vIdx=DATA[cur].length-1; showV(); }
});
let tx=null; $('viewer').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('viewer').addEventListener('touchend',e=>{ if(tx==null)return; const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>50) stepV(d<0?1:-1); tx=null; });
function closeSide(){ $('side').classList.remove('open'); $('scrim').classList.remove('on'); }
$('menu').onclick = ()=>{ $('side').classList.add('open'); $('scrim').classList.add('on'); };
$('scrim').onclick = closeSide;
window.addEventListener('hashchange', fromHash);

buildNav(); fromHash();
</script>
</body>
</html>
